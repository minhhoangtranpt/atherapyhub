<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hỏi & Đáp - ATherapyHub</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .qa-header-section {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 30px; border-bottom: 2px solid var(--border-color); padding-bottom: 15px;
        }
        .qa-header-section h2 { margin: 0; color: var(--navy-primary); }
        .btn-ask {
            background-color: var(--accent-blue); color: white; padding: 10px 20px;
            border-radius: 6px; font-weight: 600; border: none; cursor: pointer;
            box-shadow: 0 2px 4px rgba(59, 130, 246, 0.3); transition: background-color 0.2s;
        }
        .btn-ask:hover { background-color: var(--navy-secondary); }

        .qa-list-vertical { display: flex; flex-direction: column; gap: 16px; }
        .qa-card-horizontal {
            background-color: var(--bg-card); border-radius: 12px; padding: 20px 24px;
            border: 1px solid var(--border-color); display: flex; align-items: center;
            justify-content: space-between; text-decoration: none; color: inherit;
            transition: transform 0.2s, box-shadow 0.2s, border-color 0.2s;
            box-shadow: 0 2px 8px rgba(0,0,0,0.02); cursor: pointer; gap: 20px;
        }
        .qa-card-horizontal:hover {
            transform: translateY(-2px); box-shadow: 0 8px 15px rgba(0,0,0,0.05);
            border-color: var(--navy-secondary);
        }

        .qa-main-content { flex: 1; min-width: 0; }
        .qa-card-title {
            font-size: 18px; font-weight: 600; color: var(--navy-primary); line-height: 1.4;
            margin-bottom: 10px; display: -webkit-box; -webkit-line-clamp: 2;
            -webkit-box-orient: vertical; overflow: hidden;
        }
        .qa-card-meta { font-size: 13px; color: var(--text-muted); display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
        .qa-card-author { color: var(--text-main); font-weight: 500; display: flex; align-items: center; gap: 6px; }
        
        .rank-badge {
            background-color: #EFF6FF; color: var(--accent-blue); border: 1px solid #BFDBFE;
            padding: 2px 6px; border-radius: 4px; font-size: 11px; font-weight: 700;
        }

        .qa-card-thumb {
            width: 80px; height: 80px; border-radius: 8px; object-fit: cover;
            border: 1px solid var(--border-color); flex-shrink: 0;
        }

        .qa-card-replies { text-align: center; min-width: 90px; padding-left: 20px; border-left: 1px solid var(--border-color); }
        .qa-card-replies .count { font-size: 20px; font-weight: 700; color: var(--accent-blue); }
        .qa-card-replies .label { font-size: 12px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; margin-top: 4px; }

        .pagination { display: flex; justify-content: center; gap: 5px; margin-top: 40px; }
        .page-btn {
            padding: 8px 14px; border: 1px solid var(--border-color); background-color: white;
            color: var(--text-main); border-radius: 6px; cursor: pointer; font-weight: 500;
        }
        .page-btn:hover { background-color: var(--navy-light); }
        .page-btn.active { background-color: var(--navy-primary); color: white; border-color: var(--navy-primary); }

        .ask-textarea {
            width: 100%; height: 120px; padding: 12px; border: 1px solid var(--border-color);
            border-radius: 8px; resize: vertical; font-family: inherit; font-size: 14px;
            margin-bottom: 15px; background: #F8FAFC;
        }
        .ask-textarea:focus { outline: none; border-color: var(--navy-secondary); background: white; }
        .file-upload-wrapper { margin-bottom: 15px; }
        .file-upload-wrapper input[type="file"] {
            display: block; width: 100%; padding: 8px; font-size: 13px;
            border: 1px dashed var(--border-color); border-radius: 8px; background: white; cursor: pointer;
        }
        #image-preview { max-width: 100%; max-height: 150px; margin-top: 10px; border-radius: 8px; display: none; object-fit: cover; border: 1px solid var(--border-color); }

        @media (max-width: 768px) {
            .qa-header-section { flex-direction: column; align-items: flex-start; gap: 15px; }
            .qa-card-horizontal { flex-direction: column; align-items: flex-start; padding: 16px; gap: 12px; }
            .qa-main-content { padding-right: 0; width: 100%; }
            .qa-card-replies { border-left: none; padding-left: 0; text-align: left; display: flex; align-items: center; gap: 8px; }
            .qa-card-replies .label { margin-top: 0; }
            .qa-card-thumb { display: none; } /* Ẩn ảnh thu nhỏ trên mobile cho gọn */
        }
    </style>
</head>
<body>

    <main id="main-content">
        <div class="qa-header-section">
            <h2>Khu vực Hỏi & Đáp</h2>
            <button id="btn-open-ask" class="btn-ask">Đặt câu hỏi</button>
        </div>

        <div id="qa-list-container" class="qa-list-vertical">
            <div style="text-align: center; padding: 40px; color: var(--text-muted);">Đang tải dữ liệu từ máy chủ...</div>
        </div>

        <div id="pagination-container" class="pagination"></div>
    </main>

    <div id="ask-modal" class="modal-overlay">
        <div class="modal-box" style="max-width: 600px;">
            <button id="btn-close-ask" class="btn-close-modal">&times;</button>
            <h2>Đặt câu hỏi mới</h2>
            <div class="form-group">
                <label>Tiêu đề câu hỏi</label>
                <input type="text" id="ask-title" placeholder="Nhập tiêu đề ngắn gọn..." required>
            </div>
            <div class="form-group">
                <label>Nội dung chi tiết</label>
                <textarea id="ask-content" class="ask-textarea" placeholder="Mô tả chi tiết vấn đề..." required></textarea>
            </div>
            <div class="form-group file-upload-wrapper">
                <label>Đính kèm hình ảnh (Tự động nén, Tùy chọn)</label>
                <input type="file" id="ask-image" accept="image/*">
                <img id="image-preview" alt="Preview">
            </div>
            <button id="btn-submit-ask" class="btn-primary">Đăng câu hỏi</button>
        </div>
    </div>

    <script type="module" src="layout.js"></script>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, collection, addDoc, getDocs, query, orderBy, serverTimestamp, doc, getDoc, setDoc, increment } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        import { getStorage, ref, uploadString, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-storage.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBcC-sXCRnZ1eg9gzGR25HvaNi-B1P3Xuo",
            authDomain: "datatherapy-52437.firebaseapp.com",
            projectId: "datatherapy-52437",
            storageBucket: "datatherapy-52437.firebasestorage.app",
            messagingSenderId: "206559916642",
            appId: "1:206559916642:web:d4e911752ef2bb3b58973b"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const storage = getStorage(app);

        const qaContainer = document.getElementById('qa-list-container');
        const paginationContainer = document.getElementById('pagination-container');
        const imageInput = document.getElementById('ask-image');
        const imagePreview = document.getElementById('image-preview');
        
        let allQuestions = [];
        let currentPage = 1;
        const itemsPerPage = 30;
        let currentAuthorName = null;
        let currentAuthorRank = 1;
        let compressedImageBase64 = null;

        // Xử lý nén ảnh tại client bằng HTML5 Canvas
        imageInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = (event) => {
                const img = new Image();
                img.src = event.target.result;
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    const MAX_WIDTH = 800; const MAX_HEIGHT = 800;
                    let width = img.width; let height = img.height;

                    if (width > height && width > MAX_WIDTH) {
                        height *= MAX_WIDTH / width; width = MAX_WIDTH;
                    } else if (height > MAX_HEIGHT) {
                        width *= MAX_HEIGHT / height; height = MAX_HEIGHT;
                    }

                    canvas.width = width; canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);

                    compressedImageBase64 = canvas.toDataURL('image/jpeg', 0.7); // Nén 70% chất lượng
                    imagePreview.src = compressedImageBase64;
                    imagePreview.style.display = 'block';
                };
            };
        });

        async function fetchQuestions() {
            qaContainer.innerHTML = '<div style="text-align:center; padding:40px; color:var(--text-muted);">Đang tải dữ liệu...</div>';
            try {
                const q = query(collection(db, "hoi_dap"), orderBy("createdAt", "desc"));
                const querySnapshot = await getDocs(q);
                
                allQuestions = [];
                querySnapshot.forEach((docSnap) => {
                    const data = docSnap.data();
                    let dateStr = "Vừa xong";
                    if (data.createdAt && data.createdAt.toDate) {
                        const dateObj = data.createdAt.toDate();
                        dateStr = dateObj.toLocaleDateString('vi-VN') + " " + dateObj.toLocaleTimeString('vi-VN', {hour: '2-digit', minute:'2-digit'});
                    }
                    allQuestions.push({ id: docSnap.id, ...data, date: dateStr });
                });
                currentPage = 1;
                renderQAList();
            } catch (error) {
                console.error("Lỗi lấy dữ liệu:", error);
                qaContainer.innerHTML = `<div style="text-align:center; padding:40px; color:var(--danger);">Lỗi tải dữ liệu.</div>`;
            }
        }

        function renderQAList() {
            qaContainer.innerHTML = '';
            if (allQuestions.length === 0) {
                qaContainer.innerHTML = '<div style="text-align:center; padding:40px; color:var(--text-muted);">Chưa có câu hỏi nào.</div>';
                paginationContainer.innerHTML = ''; return;
            }

            const currentItems = allQuestions.slice((currentPage - 1) * itemsPerPage, currentPage * itemsPerPage);

            currentItems.forEach(q => {
                const card = document.createElement('div');
                card.className = 'qa-card-horizontal';

                const rankDisplay = q.authorRank ? `<span class="rank-badge">Cấp ${q.authorRank}</span>` : `<span class="rank-badge">Cấp 1</span>`;
                const thumbDisplay = q.imageUrl ? `<img src="${q.imageUrl}" class="qa-card-thumb" alt="Ảnh đính kèm">` : ``;

                card.innerHTML = `
                    <div class="qa-main-content">
                        <div class="qa-card-title">${q.title}</div>
                        <div class="qa-card-meta">
                            <span class="qa-card-author">Tác giả: ${q.author} ${rankDisplay}</span>
                            <span>•</span>
                            <span>${q.date}</span>
                        </div>
                    </div>
                    ${thumbDisplay}
                    <div class="qa-card-replies">
                        <div class="count">${q.repliesCount || 0}</div>
                        <div class="label">Trả lời</div>
                    </div>
                `;
                
                card.addEventListener('click', () => {
                    if (!auth.currentUser) {
                        alert("Bạn cần Đăng nhập để xem chi tiết!");
                        document.getElementById('login-modal').style.display = 'flex';
                    } else {
                        window.location.href = `chi_tiet_hoi_dap.html?id=${q.id}`;
                    }
                });
                qaContainer.appendChild(card);
            });
            renderPagination();
        }

        function renderPagination() {
            paginationContainer.innerHTML = '';
            const totalPages = Math.ceil(allQuestions.length / itemsPerPage);
            if (totalPages <= 1) return;
            for (let i = 1; i <= totalPages; i++) {
                const btn = document.createElement('button');
                btn.className = `page-btn ${i === currentPage ? 'active' : ''}`;
                btn.textContent = i;
                btn.addEventListener('click', () => { currentPage = i; renderQAList(); window.scrollTo({ top: 0, behavior: 'smooth' }); });
                paginationContainer.appendChild(btn);
            }
        }

        const askModal = document.getElementById('ask-modal');
        const btnSubmitAsk = document.getElementById('btn-submit-ask');

        document.getElementById('btn-open-ask').addEventListener('click', async () => {
            const user = auth.currentUser;
            if (!user) {
                alert("Bạn cần Đăng nhập để đặt câu hỏi!");
                document.getElementById('login-modal').style.display = 'flex'; return;
            }

            try {
                const userDocSnap = await getDoc(doc(db, "users", user.uid));
                if (userDocSnap.exists() && userDocSnap.data().displayName) {
                    currentAuthorName = userDocSnap.data().displayName;
                    currentAuthorRank = userDocSnap.data().rankLevel || 1;
                    askModal.style.display = 'flex';
                } else {
                    alert("Vui lòng cập nhật 'Tên hiển thị' trong Thông tin cá nhân trước khi đăng bài!");
                    window.location.href = "thong_tin_ca_nhan.html";
                }
            } catch (error) { console.error("Lỗi:", error); }
        });
        
        document.getElementById('btn-close-ask').addEventListener('click', () => { askModal.style.display = 'none'; });

        btnSubmitAsk.addEventListener('click', async () => {
            const titleInput = document.getElementById('ask-title');
            const contentInput = document.getElementById('ask-content');
            const titleVal = titleInput.value.trim(); const contentVal = contentInput.value.trim();

            if (!titleVal || !contentVal) return alert('Vui lòng nhập đầy đủ tiêu đề và nội dung.');
            
            btnSubmitAsk.textContent = "Đang tải lên..."; btnSubmitAsk.disabled = true;

            try {
                const user = auth.currentUser;
                let uploadedImageUrl = null;

                // Upload ảnh lên Storage nếu có
                if (compressedImageBase64) {
                    const imageName = `qa_images/${user.uid}_${Date.now()}.jpg`;
                    const storageRef = ref(storage, imageName);
                    await uploadString(storageRef, compressedImageBase64, 'data_url');
                    uploadedImageUrl = await getDownloadURL(storageRef);
                }

                // Lưu dữ liệu vào Firestore
                await addDoc(collection(db, "hoi_dap"), {
                    title: titleVal,
                    content: contentVal,
                    author: currentAuthorName,
                    authorUid: user.uid,
                    authorRank: currentAuthorRank,
                    imageUrl: uploadedImageUrl, // Lưu URL ảnh
                    repliesCount: 0,
                    createdAt: serverTimestamp() 
                });

                // Tự động cộng 1 bài viết cho hồ sơ user
                await setDoc(doc(db, "users", user.uid), { postCount: increment(1) }, { merge: true });

                // Reset form
                askModal.style.display = 'none';
                titleInput.value = ''; contentInput.value = ''; imageInput.value = '';
                imagePreview.style.display = 'none'; compressedImageBase64 = null;
                btnSubmitAsk.textContent = "Đăng câu hỏi"; btnSubmitAsk.disabled = false;

                fetchQuestions();
                alert('Đăng câu hỏi thành công!');

            } catch (error) {
                console.error("Lỗi:", error); alert("Có lỗi xảy ra. Hãy chắc chắn bạn đã cấp quyền Storage.");
                btnSubmitAsk.textContent = "Đăng câu hỏi"; btnSubmitAsk.disabled = false;
            }
        });

        fetchQuestions();
    </script>
</body>
</html>
