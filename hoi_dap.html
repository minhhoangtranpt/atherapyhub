<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hỏi & Đáp - ATherapyHub</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .qa-header-section {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 15px; border-bottom: 2px solid var(--border-color); padding-bottom: 10px;
            flex-wrap: wrap; gap: 10px;
        }
        .qa-header-section h2 { margin: 0; color: var(--navy-primary); font-size: 20px; }
        
        .header-actions { display: flex; align-items: center; gap: 15px; }

        .sort-select {
            padding: 6px 10px; border-radius: 6px; border: 1px solid var(--border-color);
            background-color: var(--bg-body); color: var(--text-main); font-size: 13px;
            font-family: inherit; outline: none; cursor: pointer;
        }
        .sort-select:focus { border-color: var(--navy-secondary); }

        .btn-ask {
            background-color: var(--accent-blue); color: white; padding: 6px 16px;
            border-radius: 6px; font-weight: 600; border: none; cursor: pointer;
            font-size: 14px; transition: background-color 0.2s;
        }
        .btn-ask:hover { background-color: var(--navy-primary); }

        .qa-list-vertical { 
            display: flex; flex-direction: column; gap: 0; 
            background: var(--bg-card); border: 1px solid var(--border-color); 
            border-radius: 8px; overflow: hidden;
        }
        
        .qa-card-horizontal {
            padding: 12px 15px; border-bottom: 1px solid var(--border-color);
            display: flex; align-items: center; justify-content: space-between; 
            text-decoration: none; color: inherit; gap: 15px; transition: background-color 0.2s;
        }
        .qa-card-horizontal:last-child { border-bottom: none; }
        .qa-card-horizontal:hover { background-color: var(--navy-light); }

        .qa-main-content { flex: 1; min-width: 0; }
        .qa-card-title {
            font-size: 15px; font-weight: 600; color: var(--navy-primary); line-height: 1.3;
            margin-bottom: 4px; display: -webkit-box; -webkit-line-clamp: 2;
            -webkit-box-orient: vertical; overflow: hidden;
        }
        .qa-card-meta { font-size: 12px; color: var(--text-muted); display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
        .qa-card-author { color: var(--text-main); font-weight: 500; }

        .qa-card-thumb {
            width: 45px; height: 45px; border-radius: 4px; object-fit: cover;
            border: 1px solid var(--border-color); flex-shrink: 0;
        }

        .qa-card-replies { text-align: center; min-width: 60px; padding-left: 15px; border-left: 1px solid var(--border-color); }
        .qa-card-replies .count { font-size: 16px; font-weight: 700; color: var(--accent-blue); }
        .qa-card-replies .label { font-size: 10px; color: var(--text-muted); text-transform: uppercase; margin-top: 2px; }

        .pagination { display: flex; justify-content: center; gap: 5px; margin-top: 20px; }
        .page-btn {
            padding: 6px 12px; border: 1px solid var(--border-color); background-color: white;
            color: var(--text-main); border-radius: 4px; cursor: pointer; font-size: 13px; font-weight: 500;
        }
        .page-btn:hover { background-color: var(--navy-light); }
        .page-btn.active { background-color: var(--navy-primary); color: white; border-color: var(--navy-primary); }

        /* Modal Đặt Câu Hỏi */
        .modal-box { padding: 24px !important; box-shadow: 0 4px 20px rgba(0,0,0,0.05); }
        .ask-textarea {
            width: 100%; height: 100px; padding: 10px; border: 1px solid var(--border-color);
            border-radius: 6px; resize: vertical; font-family: inherit; font-size: 14px;
            margin-bottom: 10px; background: #F8FAFC;
        }
        .ask-textarea:focus { outline: none; border-color: var(--navy-secondary); background: white; }
        
        /* Giao diện vùng tải/dán ảnh */
        .file-upload-wrapper {
            margin-bottom: 15px; padding: 15px; text-align: center;
            border: 1px dashed var(--border-color); border-radius: 6px; 
            background: #F8FAFC; cursor: pointer; transition: border-color 0.2s;
        }
        .file-upload-wrapper:hover { border-color: var(--navy-secondary); }
        .file-upload-wrapper label { cursor: pointer; display: block; }
        .file-upload-wrapper input[type="file"] { display: none; } /* Ẩn nút chọn file mặc định xấu xí */
        .paste-hint { font-size: 12px; color: var(--text-muted); margin-top: 4px; }
        #image-preview { max-width: 100%; max-height: 150px; margin-top: 10px; border-radius: 4px; display: none; object-fit: contain; border: 1px solid var(--border-color); }

        @media (max-width: 768px) {
            #main-content { margin: 15px auto; padding: 0 10px; }
            .qa-header-section { margin-bottom: 10px; padding-bottom: 8px; }
            .header-actions { width: 100%; justify-content: space-between; }
            .qa-card-horizontal { padding: 10px; gap: 10px; }
            .qa-card-thumb { display: none; }
            .qa-card-replies { border-left: none; padding-left: 0; min-width: 40px; }
        }
    </style>
</head>
<body>

    <main id="main-content">
        <div class="qa-header-section">
            <h2>Hỏi & Đáp</h2>
            <div class="header-actions">
                <select id="sort-select" class="sort-select">
                    <option value="newest">Mới đăng</option>
                    <option value="replies">Nhiều lượt trả lời</option>
                    <option value="active">Mới trả lời</option>
                </select>
                <button id="btn-open-ask" class="btn-ask">Đặt câu hỏi</button>
            </div>
        </div>

        <div id="qa-list-container" class="qa-list-vertical">
            <div style="text-align: center; padding: 30px; color: var(--text-muted); font-size: 14px;">Đang tải dữ liệu...</div>
        </div>

        <div id="pagination-container" class="pagination"></div>
    </main>

    <div id="ask-modal" class="modal-overlay">
        <div class="modal-box" style="max-width: 600px;">
            <button id="btn-close-ask" class="btn-close-modal">&times;</button>
            <h2 style="margin-bottom: 15px; font-size: 18px;">Đặt câu hỏi mới</h2>
            <div class="form-group" style="margin-bottom: 10px;">
                <input type="text" id="ask-title" placeholder="Nhập tiêu đề ngắn gọn..." required style="padding: 10px; font-weight: 500;">
            </div>
            <div class="form-group" style="margin-bottom: 10px;">
                <textarea id="ask-content" class="ask-textarea" placeholder="Mô tả chi tiết vấn đề lâm sàng, thắc mắc..." required></textarea>
            </div>
            
            <div class="form-group file-upload-wrapper" id="drop-zone" onclick="document.getElementById('ask-image').click()">
                <label style="font-size: 13px; color: var(--navy-primary); font-weight: 600;">📁 Nhấn để chọn ảnh hoặc dán ảnh (Ctrl+V) vào đây</label>
                <div class="paste-hint">(Hỗ trợ JPG, PNG, GIF...)</div>
                <input type="file" id="ask-image" accept="image/png, image/jpeg, image/jpg, image/gif, image/webp">
                <img id="image-preview" alt="Preview">
            </div>

            <button id="btn-submit-ask" class="btn-primary" style="padding: 10px; font-size: 14px; border-radius: 6px; margin-top: 0;">Đăng câu hỏi</button>
        </div>
    </div>

    <script type="module" src="layout.js"></script>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, collection, addDoc, getDocs, query, orderBy, serverTimestamp, doc, getDoc, setDoc, increment } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBcC-sXCRnZ1eg9gzGR25HvaNi-B1P3Xuo",
            authDomain: "datatherapy-52437.firebaseapp.com",
            projectId: "datatherapy-52437",
            storageBucket: "datatherapy-52437.firebasestorage.app",
            messagingSenderId: "206559916642",
            appId: "1:206559916642:web:d4e911752ef2bb3b58973b"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        const qaContainer = document.getElementById('qa-list-container');
        const paginationContainer = document.getElementById('pagination-container');
        const imageInput = document.getElementById('ask-image');
        const imagePreview = document.getElementById('image-preview');
        const sortSelect = document.getElementById('sort-select');
        const askModal = document.getElementById('ask-modal');
        
        let allQuestions = [];
        let currentPage = 1;
        const itemsPerPage = 15;
        let currentAuthorName = null;
        let compressedImageBase64 = null;

        // HÀM XỬ LÝ NÉN VÀ HIỂN THỊ ẢNH CHUNG
        function processImageFile(file) {
            if (!file) return;
            if (!file.type.startsWith('image/')) {
                alert('Vui lòng chỉ tải lên các tệp hình ảnh.');
                return;
            }

            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = (event) => {
                const img = new Image();
                img.src = event.target.result;
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    const MAX_WIDTH = 800; const MAX_HEIGHT = 800;
                    let width = img.width; let height = img.height;

                    if (width > height && width > MAX_WIDTH) {
                        height *= MAX_WIDTH / width; width = MAX_WIDTH;
                    } else if (height > MAX_HEIGHT) {
                        width *= MAX_HEIGHT / height; height = MAX_HEIGHT;
                    }

                    canvas.width = width; canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);

                    compressedImageBase64 = canvas.toDataURL('image/jpeg', 0.7); 
                    imagePreview.src = compressedImageBase64;
                    imagePreview.style.display = 'block';
                };
            };
        }

        // Xử lý khi chọn file qua nút
        imageInput.addEventListener('change', (e) => {
            processImageFile(e.target.files[0]);
        });

        // XỬ LÝ SỰ KIỆN DÁN ẢNH (CTRL+V / CMD+V)
        askModal.addEventListener('paste', (e) => {
            const items = (e.clipboardData || e.originalEvent.clipboardData).items;
            for (let index in items) {
                const item = items[index];
                if (item.kind === 'file' && item.type.startsWith('image/')) {
                    const blob = item.getAsFile();
                    processImageFile(blob);
                }
            }
        });

        async function fetchQuestions() {
            qaContainer.innerHTML = '<div style="text-align:center; padding:30px; color:var(--text-muted); font-size:14px;">Đang tải dữ liệu...</div>';
            try {
                const q = query(collection(db, "hoi_dap"));
                const querySnapshot = await getDocs(q);
                
                allQuestions = [];
                querySnapshot.forEach((docSnap) => {
                    const data = docSnap.data();
                    let dateStr = "Vừa xong";
                    let createdTime = 0;
                    let updatedTime = 0;

                    if (data.createdAt && data.createdAt.toDate) {
                        const dateObj = data.createdAt.toDate();
                        createdTime = dateObj.getTime();
                        updatedTime = createdTime;
                        dateStr = dateObj.toLocaleDateString('vi-VN') + " " + dateObj.toLocaleTimeString('vi-VN', {hour: '2-digit', minute:'2-digit'});
                    }

                    if (data.updatedAt && data.updatedAt.toDate) {
                        updatedTime = data.updatedAt.toDate().getTime(); 
                    }

                    allQuestions.push({ 
                        id: docSnap.id, 
                        title: data.title,
                        author: data.author || "Người dùng ẩn danh",
                        date: dateStr,
                        imageUrl: data.imageUrl || null,
                        repliesCount: data.repliesCount || 0,
                        createdTime: createdTime,
                        updatedTime: updatedTime
                    });
                });
                
                sortAndRenderQuestions();
            } catch (error) {
                console.error("Lỗi lấy dữ liệu:", error);
                qaContainer.innerHTML = `<div style="text-align:center; padding:30px; color:var(--danger); font-size:14px;">Lỗi tải dữ liệu.</div>`;
            }
        }

        function sortAndRenderQuestions() {
            const sortType = sortSelect.value;
            
            if (sortType === 'newest') {
                allQuestions.sort((a, b) => b.createdTime - a.createdTime);
            } else if (sortType === 'replies') {
                allQuestions.sort((a, b) => b.repliesCount - a.repliesCount);
            } else if (sortType === 'active') {
                allQuestions.sort((a, b) => b.updatedTime - a.updatedTime);
            }

            currentPage = 1;
            renderQAList();
        }

        sortSelect.addEventListener('change', sortAndRenderQuestions);

        function renderQAList() {
            qaContainer.innerHTML = '';
            if (allQuestions.length === 0) {
                qaContainer.innerHTML = '<div style="text-align:center; padding:30px; color:var(--text-muted); font-size:14px;">Chưa có câu hỏi nào.</div>';
                paginationContainer.innerHTML = ''; return;
            }

            const currentItems = allQuestions.slice((currentPage - 1) * itemsPerPage, currentPage * itemsPerPage);

            currentItems.forEach(q => {
                const card = document.createElement('div');
                card.className = 'qa-card-horizontal';

                const thumbDisplay = q.imageUrl ? `<img src="${q.imageUrl}" class="qa-card-thumb" alt="Ảnh đính kèm">` : ``;

                card.innerHTML = `
                    <div class="qa-main-content">
                        <div class="qa-card-title">${q.title}</div>
                        <div class="qa-card-meta">
                            <span class="qa-card-author">${q.author}</span>
                            <span>•</span>
                            <span>${q.date}</span>
                        </div>
                    </div>
                    ${thumbDisplay}
                    <div class="qa-card-replies">
                        <div class="count">${q.repliesCount}</div>
                        <div class="label">Trả lời</div>
                    </div>
                `;
                
                card.addEventListener('click', () => {
                    if (!auth.currentUser) {
                        alert("Bạn cần Đăng nhập để xem chi tiết!");
                        document.getElementById('login-modal').style.display = 'flex';
                    } else {
                        window.location.href = `chi_tiet_hoi_dap.html?id=${q.id}`;
                    }
                });
                qaContainer.appendChild(card);
            });
            renderPagination();
        }

        function renderPagination() {
            paginationContainer.innerHTML = '';
            const totalPages = Math.ceil(allQuestions.length / itemsPerPage);
            if (totalPages <= 1) return;
            for (let i = 1; i <= totalPages; i++) {
                const btn = document.createElement('button');
                btn.className = `page-btn ${i === currentPage ? 'active' : ''}`;
                btn.textContent = i;
                btn.addEventListener('click', () => { currentPage = i; renderQAList(); window.scrollTo({ top: 0, behavior: 'smooth' }); });
                paginationContainer.appendChild(btn);
            }
        }

        const btnSubmitAsk = document.getElementById('btn-submit-ask');

        document.getElementById('btn-open-ask').addEventListener('click', async () => {
            const user = auth.currentUser;
            if (!user) {
                alert("Bạn cần Đăng nhập để đặt câu hỏi!");
                document.getElementById('login-modal').style.display = 'flex'; return;
            }

            try {
                const userDocSnap = await getDoc(doc(db, "users", user.uid));
                if (userDocSnap.exists() && userDocSnap.data().displayName && userDocSnap.data().displayName.trim() !== '') {
                    currentAuthorName = userDocSnap.data().displayName;
                    askModal.style.display = 'flex';
                } else {
                    alert("Vui lòng cập nhật 'Tên hiển thị' trong Thông tin cá nhân trước khi đăng bài!");
                    window.location.href = "thong_tin_ca_nhan.html";
                }
            } catch (error) { console.error("Lỗi:", error); }
        });
        
        document.getElementById('btn-close-ask').addEventListener('click', () => { askModal.style.display = 'none'; });

        btnSubmitAsk.addEventListener('click', async () => {
            const titleInput = document.getElementById('ask-title');
            const contentInput = document.getElementById('ask-content');
            const titleVal = titleInput.value.trim(); const contentVal = contentInput.value.trim();

            if (!titleVal || !contentVal) return alert('Vui lòng nhập đầy đủ tiêu đề và nội dung.');
            
            btnSubmitAsk.textContent = "Đang tải lên..."; btnSubmitAsk.disabled = true;

            try {
                const user = auth.currentUser;

                await addDoc(collection(db, "hoi_dap"), {
                    title: titleVal,
                    content: contentVal,
                    author: currentAuthorName,
                    authorUid: user.uid,
                    imageUrl: compressedImageBase64, 
                    repliesCount: 0,
                    createdAt: serverTimestamp(),
                    updatedAt: serverTimestamp() 
                });

                await setDoc(doc(db, "users", user.uid), { postCount: increment(1) }, { merge: true });

                askModal.style.display = 'none';
                titleInput.value = ''; contentInput.value = ''; imageInput.value = '';
                imagePreview.style.display = 'none'; compressedImageBase64 = null;
                btnSubmitAsk.textContent = "Đăng câu hỏi"; btnSubmitAsk.disabled = false;

                fetchQuestions();
                alert('Đăng câu hỏi thành công!');

            } catch (error) {
                console.error("Lỗi:", error); alert("Có lỗi xảy ra khi tải bài viết.");
                btnSubmitAsk.textContent = "Đăng câu hỏi"; btnSubmitAsk.disabled = false;
            }
        });

        fetchQuestions();
    </script>
</body>
</html>
