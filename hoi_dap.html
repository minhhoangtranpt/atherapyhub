<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hỏi & Đáp - ATherapyHub</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* Bố cục tiêu đề trang */
        .qa-header-section {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 15px;
        }

        .qa-header-section h2 {
            margin: 0;
            color: var(--navy-primary);
        }

        .btn-ask {
            background-color: var(--accent-blue);
            color: white;
            padding: 8px 16px;
            border-radius: 6px;
            font-weight: 600;
            border: none;
            cursor: pointer;
            text-decoration: none;
        }

        .btn-ask:hover {
            background-color: var(--navy-secondary);
        }

        /* Thiết kế dạng danh sách nén (Compact List) */
        .qa-table {
            width: 100%;
            background-color: var(--bg-card);
            border-radius: 8px;
            border: 1px solid var(--border-color);
            overflow: hidden;
        }

        .qa-row {
            display: flex;
            align-items: center;
            padding: 12px 15px;
            border-bottom: 1px solid var(--border-color);
            text-decoration: none;
            color: inherit;
            transition: background-color 0.2s;
        }

        .qa-row:last-child {
            border-bottom: none;
        }

        .qa-row:hover:not(.qa-header) {
            background-color: var(--navy-light);
        }

        .qa-header {
            background-color: #F1F5F9;
            font-weight: 600;
            color: var(--text-muted);
            font-size: 13px;
            text-transform: uppercase;
        }

        /* Phân chia các cột */
        .col-title {
            flex: 1;
            padding-right: 15px;
        }

        .qa-title-text {
            color: var(--navy-primary);
            font-weight: 500;
            display: -webkit-box;
            -webkit-line-clamp: 1;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .col-author {
            width: 150px;
            font-size: 13px;
            color: var(--text-main);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .col-date {
            width: 100px;
            font-size: 13px;
            color: var(--text-muted);
            text-align: right;
        }

        .col-replies {
            width: 80px;
            font-size: 13px;
            color: var(--navy-secondary);
            font-weight: 600;
            text-align: center;
        }
        
        .col-status {
            width: 100px;
            text-align: right;
            font-size: 12px;
        }

        .status-resolved {
            color: #03543F;
            background-color: #DEF7EC;
            padding: 2px 6px;
            border-radius: 4px;
        }

        /* Phân trang (Pagination) */
        .pagination {
            display: flex;
            justify-content: center;
            gap: 5px;
            margin-top: 25px;
        }

        .page-btn {
            padding: 6px 12px;
            border: 1px solid var(--border-color);
            background-color: white;
            color: var(--text-main);
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
        }

        .page-btn:hover {
            background-color: var(--navy-light);
        }

        .page-btn.active {
            background-color: var(--navy-primary);
            color: white;
            border-color: var(--navy-primary);
        }

        /* Modal đặt câu hỏi */
        .ask-textarea {
            width: 100%;
            height: 120px;
            padding: 12px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            resize: vertical;
            font-family: inherit;
            font-size: 14px;
            margin-bottom: 15px;
        }

        @media (max-width: 768px) {
            .col-author, .col-date, .col-status {
                display: none; /* Ẩn bớt cột trên điện thoại để tiết kiệm diện tích */
            }
            .col-replies {
                width: 60px;
            }
            .qa-title-text {
                -webkit-line-clamp: 2; /* Cho phép rớt 2 dòng trên mobile */
            }
        }
    </style>
</head>
<body>

    <main id="main-content">
        
        <div class="qa-header-section">
            <h2>Khu vực Hỏi & Đáp</h2>
            <button id="btn-open-ask" class="btn-ask">Đặt câu hỏi</button>
        </div>

        <!-- Khung danh sách bài viết -->
        <div class="qa-table">
            <div class="qa-row qa-header">
                <div class="col-title">Chủ đề</div>
                <div class="col-status">Trạng thái</div>
                <div class="col-author">Tác giả</div>
                <div class="col-replies">Trả lời</div>
                <div class="col-date">Ngày đăng</div>
            </div>
            
            <div id="qa-list-container">
                <div style="text-align: center; padding: 20px; color: var(--text-muted);">Đang tải dữ liệu...</div>
            </div>
        </div>

        <!-- Khu vực phân trang -->
        <div id="pagination-container" class="pagination"></div>

    </main>

    <!-- Modal Đặt câu hỏi -->
    <div id="ask-modal" class="modal-overlay">
        <div class="modal-box" style="max-width: 500px;">
            <button id="btn-close-ask" class="btn-close-modal">&times;</button>
            <h2>Đặt câu hỏi mới</h2>
            <div class="form-group">
                <label>Tiêu đề câu hỏi</label>
                <input type="text" id="ask-title" placeholder="Nhập tiêu đề ngắn gọn, rõ ràng..." required>
            </div>
            <div class="form-group">
                <label>Nội dung chi tiết</label>
                <textarea id="ask-content" class="ask-textarea" placeholder="Mô tả chi tiết ca lâm sàng hoặc vấn đề bạn cần thảo luận..." required></textarea>
            </div>
            <button id="btn-submit-ask" class="btn-primary">Đăng câu hỏi</button>
        </div>
    </div>

    <script type="module" src="layout.js"></script>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const qaContainer = document.getElementById('qa-list-container');
            const paginationContainer = document.getElementById('pagination-container');
            
            // Khởi tạo mảng dữ liệu mô phỏng lớn để test phân trang
            let mockQuestions = [];
            for (let i = 1; i <= 75; i++) {
                mockQuestions.push({
                    id: "qa" + i,
                    title: `Câu hỏi thảo luận lâm sàng số ${i} về các phương pháp phục hồi chức năng`,
                    author: `Thành viên ${i}`,
                    date: "16/10/2026",
                    repliesCount: Math.floor(Math.random() * 20),
                    isResolved: i % 5 === 0 // Cứ 5 bài thì 1 bài đánh dấu đã giải quyết
                });
            }

            // Cấu hình phân trang
            let currentPage = 1;
            const itemsPerPage = 30;

            function renderQAList() {
                qaContainer.innerHTML = '';
                
                if (mockQuestions.length === 0) {
                    qaContainer.innerHTML = '<div style="padding:20px; text-align:center; color:var(--text-muted);">Chưa có câu hỏi nào.</div>';
                    return;
                }

                // Tính toán vị trí cắt mảng dữ liệu
                const startIndex = (currentPage - 1) * itemsPerPage;
                const endIndex = startIndex + itemsPerPage;
                const currentItems = mockQuestions.slice(startIndex, endIndex);

                currentItems.forEach(q => {
                    const statusHtml = q.isResolved 
                        ? `<span class="status-resolved">Đã giải quyết</span>` 
                        : `<span style="color:var(--text-muted);">-</span>`;

                    const row = document.createElement('a');
                    row.href = `chi_tiet_hoi_dap.html?id=${q.id}`;
                    row.className = 'qa-row';

                    row.innerHTML = `
                        <div class="col-title">
                            <div class="qa-title-text">${q.title}</div>
                        </div>
                        <div class="col-status">${statusHtml}</div>
                        <div class="col-author">${q.author}</div>
                        <div class="col-replies">${q.repliesCount}</div>
                        <div class="col-date">${q.date}</div>
                    `;
                    qaContainer.appendChild(row);
                });

                renderPagination();
            }

            function renderPagination() {
                paginationContainer.innerHTML = '';
                const totalPages = Math.ceil(mockQuestions.length / itemsPerPage);

                if (totalPages <= 1) return;

                for (let i = 1; i <= totalPages; i++) {
                    const btn = document.createElement('button');
                    btn.className = `page-btn ${i === currentPage ? 'active' : ''}`;
                    btn.textContent = i;
                    btn.addEventListener('click', () => {
                        currentPage = i;
                        renderQAList();
                        window.scrollTo({ top: 0, behavior: 'smooth' });
                    });
                    paginationContainer.appendChild(btn);
                }
            }

            // Hiển thị dữ liệu lần đầu
            renderQAList();

            // Xử lý Modal Đặt câu hỏi
            const askModal = document.getElementById('ask-modal');
            document.getElementById('btn-open-ask').addEventListener('click', () => {
                askModal.style.display = 'flex';
            });
            
            document.getElementById('btn-close-ask').addEventListener('click', () => {
                askModal.style.display = 'none';
            });

            document.getElementById('btn-submit-ask').addEventListener('click', () => {
                const titleInput = document.getElementById('ask-title');
                const contentInput = document.getElementById('ask-content');

                if (titleInput.value.trim() === '' || contentInput.value.trim() === '') {
                    alert('Vui lòng nhập đầy đủ tiêu đề và nội dung.');
                    return;
                }

                // Thêm câu hỏi mới vào đầu mảng
                const newId = "qa" + (mockQuestions.length + 1);
                mockQuestions.unshift({
                    id: newId,
                    title: titleInput.value,
                    author: "Người dùng (Bạn)",
                    date: "Vừa xong",
                    repliesCount: 0,
                    isResolved: false
                });

                // Đóng modal, xóa form, quay về trang 1 và render lại
                askModal.style.display = 'none';
                titleInput.value = '';
                contentInput.value = '';
                currentPage = 1;
                renderQAList();
                alert('Đăng câu hỏi thành công!');
            });
        });
    </script>
</body>
</html>
