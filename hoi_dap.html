<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hỏi & Đáp - ATherapyHub</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* Bố cục tiêu đề trang */
        .qa-header-section {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 15px;
        }

        .qa-header-section h2 {
            margin: 0;
            color: var(--navy-primary);
        }

        .btn-ask {
            background-color: var(--accent-blue);
            color: white;
            padding: 10px 20px;
            border-radius: 6px;
            font-weight: 600;
            border: none;
            cursor: pointer;
            box-shadow: 0 2px 4px rgba(59, 130, 246, 0.3);
            transition: background-color 0.2s;
        }

        .btn-ask:hover {
            background-color: var(--navy-secondary);
        }

        /* Giao diện Danh sách thẻ ngang (Horizontal Card List) */
        .qa-list-vertical {
            display: flex;
            flex-direction: column;
            gap: 16px; /* Khoảng cách giữa các thẻ ngang */
        }

        .qa-card-horizontal {
            background-color: var(--bg-card);
            border-radius: 12px;
            padding: 20px 24px;
            border: 1px solid var(--border-color);
            display: flex;
            align-items: center; /* Căn giữa nội dung theo chiều dọc */
            justify-content: space-between;
            text-decoration: none;
            color: inherit;
            transition: transform 0.2s, box-shadow 0.2s, border-color 0.2s;
            box-shadow: 0 2px 8px rgba(0,0,0,0.02);
            cursor: pointer;
        }

        .qa-card-horizontal:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 15px rgba(0,0,0,0.05);
            border-color: var(--navy-secondary);
        }

        /* Phần nội dung bài viết (Bên trái) */
        .qa-main-content {
            flex: 1;
            padding-right: 20px;
        }

        .qa-card-title {
            font-size: 18px;
            font-weight: 600;
            color: var(--navy-primary);
            line-height: 1.4;
            margin-bottom: 10px;
            display: -webkit-box;
            -webkit-line-clamp: 2; /* Tối đa 2 dòng, quá thì hiện ... */
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .qa-card-meta {
            font-size: 13px;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 12px;
        }
        
        .qa-card-author {
            color: var(--text-main);
            font-weight: 500;
        }

        /* Phần thống kê lượt trả lời (Bên phải) */
        .qa-card-replies {
            text-align: center;
            min-width: 90px;
            padding-left: 20px;
            border-left: 1px solid var(--border-color);
        }

        .qa-card-replies .count {
            font-size: 20px;
            font-weight: 700;
            color: var(--accent-blue);
        }

        .qa-card-replies .label {
            font-size: 12px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-top: 4px;
        }

        /* Phân trang (Pagination) */
        .pagination {
            display: flex;
            justify-content: center;
            gap: 5px;
            margin-top: 40px;
        }

        .page-btn {
            padding: 8px 14px;
            border: 1px solid var(--border-color);
            background-color: white;
            color: var(--text-main);
            border-radius: 6px;
            cursor: pointer;
            font-weight: 500;
        }

        .page-btn:hover {
            background-color: var(--navy-light);
        }

        .page-btn.active {
            background-color: var(--navy-primary);
            color: white;
            border-color: var(--navy-primary);
        }

        /* Modal đặt câu hỏi */
        .ask-textarea {
            width: 100%;
            height: 150px;
            padding: 12px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            resize: vertical;
            font-family: inherit;
            font-size: 14px;
            margin-bottom: 15px;
            background: #F8FAFC;
        }
        
        .ask-textarea:focus {
            outline: none;
            border-color: var(--navy-secondary);
            background: white;
        }

        /* Tối ưu hóa cho Điện thoại di động */
        @media (max-width: 768px) {
            .qa-header-section {
                flex-direction: column;
                align-items: flex-start;
                gap: 15px;
            }
            .qa-card-horizontal {
                flex-direction: column;
                align-items: flex-start;
                padding: 16px;
            }
            .qa-main-content {
                padding-right: 0;
                margin-bottom: 12px;
            }
            .qa-card-replies {
                border-left: none;
                padding-left: 0;
                text-align: left;
                display: flex;
                align-items: center;
                gap: 8px; /* Trên mobile hiện hàng ngang: Trả lời 5 */
            }
            .qa-card-replies .label {
                margin-top: 0;
            }
        }
    </style>
</head>
<body>

    <main id="main-content">
        
        <div class="qa-header-section">
            <h2>Khu vực Hỏi & Đáp</h2>
            <button id="btn-open-ask" class="btn-ask">Đặt câu hỏi</button>
        </div>

        <!-- Khung danh sách bài viết dạng Thẻ ngang (Horizontal List) -->
        <div id="qa-list-container" class="qa-list-vertical">
            <div style="text-align: center; padding: 40px; color: var(--text-muted);">Đang tải dữ liệu từ máy chủ...</div>
        </div>

        <!-- Khu vực phân trang -->
        <div id="pagination-container" class="pagination"></div>

    </main>

    <!-- Modal Đặt câu hỏi -->
    <div id="ask-modal" class="modal-overlay">
        <div class="modal-box" style="max-width: 600px;">
            <button id="btn-close-ask" class="btn-close-modal">&times;</button>
            <h2>Đặt câu hỏi mới</h2>
            <div class="form-group">
                <label>Tiêu đề câu hỏi</label>
                <input type="text" id="ask-title" placeholder="Nhập tiêu đề ngắn gọn, rõ ràng..." required>
            </div>
            <div class="form-group">
                <label>Nội dung chi tiết</label>
                <textarea id="ask-content" class="ask-textarea" placeholder="Mô tả chi tiết ca lâm sàng hoặc vấn đề bạn cần thảo luận..." required></textarea>
            </div>
            <button id="btn-submit-ask" class="btn-primary">Đăng câu hỏi</button>
        </div>
    </div>

    <!-- Nạp Layout Header/Footer -->
    <script type="module" src="layout.js"></script>

    <!-- Script xử lý Firebase Firestore -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { 
            getFirestore, 
            collection, 
            addDoc, 
            getDocs, 
            query, 
            orderBy, 
            serverTimestamp 
        } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // Cấu hình chung
        const firebaseConfig = {
            apiKey: "AIzaSyBcC-sXCRnZ1eg9gzGR25HvaNi-B1P3Xuo",
            authDomain: "datatherapy-52437.firebaseapp.com",
            projectId: "datatherapy-52437",
            storageBucket: "datatherapy-52437.firebasestorage.app",
            messagingSenderId: "206559916642",
            appId: "1:206559916642:web:d4e911752ef2bb3b58973b"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        const qaContainer = document.getElementById('qa-list-container');
        const paginationContainer = document.getElementById('pagination-container');
        
        let allQuestions = [];
        let currentPage = 1;
        const itemsPerPage = 30; // Max 30 thẻ ngang 1 trang

        // 1. HÀM TẢI DỮ LIỆU TỪ FIREBASE
        async function fetchQuestions() {
            qaContainer.innerHTML = '<div style="text-align:center; padding:40px; color:var(--text-muted);">Đang tải dữ liệu...</div>';
            try {
                const q = query(collection(db, "hoi_dap"), orderBy("createdAt", "desc"));
                const querySnapshot = await getDocs(q);
                
                allQuestions = [];
                querySnapshot.forEach((doc) => {
                    const data = doc.data();
                    
                    let dateStr = "Vừa xong";
                    if (data.createdAt && data.createdAt.toDate) {
                        const dateObj = data.createdAt.toDate();
                        dateStr = dateObj.toLocaleDateString('vi-VN') + " " + dateObj.toLocaleTimeString('vi-VN', {hour: '2-digit', minute:'2-digit'});
                    }

                    allQuestions.push({
                        id: doc.id,
                        title: data.title,
                        author: data.author || "Người dùng ẩn danh",
                        date: dateStr,
                        repliesCount: data.repliesCount || 0
                    });
                });

                currentPage = 1;
                renderQAList();

            } catch (error) {
                console.error("Lỗi lấy dữ liệu:", error);
                qaContainer.innerHTML = `<div style="text-align:center; padding:40px; color:var(--danger);">Lỗi tải dữ liệu. Vui lòng thử lại.</div>`;
            }
        }

        // 2. HÀM HIỂN THỊ DANH SÁCH THẺ NGANG VÀ PHÂN TRANG
        function renderQAList() {
            qaContainer.innerHTML = '';
            
            if (allQuestions.length === 0) {
                qaContainer.innerHTML = '<div style="text-align:center; padding:40px; color:var(--text-muted);">Chưa có câu hỏi nào. Hãy là người đầu tiên đặt câu hỏi!</div>';
                paginationContainer.innerHTML = '';
                return;
            }

            const startIndex = (currentPage - 1) * itemsPerPage;
            const endIndex = startIndex + itemsPerPage;
            const currentItems = allQuestions.slice(startIndex, endIndex);

            currentItems.forEach(q => {
                const card = document.createElement('div');
                card.className = 'qa-card-horizontal';

                card.innerHTML = `
                    <div class="qa-main-content">
                        <div class="qa-card-title">${q.title}</div>
                        <div class="qa-card-meta">
                            <span class="qa-card-author">Tác giả: ${q.author}</span>
                            <span>•</span>
                            <span>${q.date}</span>
                        </div>
                    </div>
                    <div class="qa-card-replies">
                        <div class="count">${q.repliesCount}</div>
                        <div class="label">Trả lời</div>
                    </div>
                `;
                
                // KIỂM TRA ĐĂNG NHẬP KHI CLICK VÀO XEM CHI TIẾT
                card.addEventListener('click', () => {
                    if (!auth.currentUser) {
                        alert("Bạn cần Đăng nhập để xem chi tiết câu hỏi này!");
                        document.getElementById('login-modal').style.display = 'flex';
                    } else {
                        window.location.href = `chi_tiet_hoi_dap.html?id=${q.id}`;
                    }
                });

                qaContainer.appendChild(card);
            });

            renderPagination();
        }

        function renderPagination() {
            paginationContainer.innerHTML = '';
            const totalPages = Math.ceil(allQuestions.length / itemsPerPage);

            if (totalPages <= 1) return;

            for (let i = 1; i <= totalPages; i++) {
                const btn = document.createElement('button');
                btn.className = `page-btn ${i === currentPage ? 'active' : ''}`;
                btn.textContent = i;
                btn.addEventListener('click', () => {
                    currentPage = i;
                    renderQAList();
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                });
                paginationContainer.appendChild(btn);
            }
        }

        // 3. XỬ LÝ ĐẶT CÂU HỎI MỚI (Bắt buộc đăng nhập)
        const askModal = document.getElementById('ask-modal');
        const btnSubmitAsk = document.getElementById('btn-submit-ask');

        document.getElementById('btn-open-ask').addEventListener('click', () => {
            if (!auth.currentUser) {
                alert("Bạn cần Đăng nhập để đặt câu hỏi!");
                document.getElementById('login-modal').style.display = 'flex';
                return;
            }
            askModal.style.display = 'flex';
        });
        
        document.getElementById('btn-close-ask').addEventListener('click', () => {
            askModal.style.display = 'none';
        });

        btnSubmitAsk.addEventListener('click', async () => {
            const titleInput = document.getElementById('ask-title');
            const contentInput = document.getElementById('ask-content');
            const titleVal = titleInput.value.trim();
            const contentVal = contentInput.value.trim();

            if (titleVal === '' || contentVal === '') {
                alert('Vui lòng nhập đầy đủ tiêu đề và nội dung.');
                return;
            }

            btnSubmitAsk.textContent = "Đang gửi...";
            btnSubmitAsk.disabled = true;

            try {
                const authorName = auth.currentUser.email;

                await addDoc(collection(db, "hoi_dap"), {
                    title: titleVal,
                    content: contentVal,
                    author: authorName,
                    repliesCount: 0,
                    createdAt: serverTimestamp() 
                });

                askModal.style.display = 'none';
                titleInput.value = '';
                contentInput.value = '';
                btnSubmitAsk.textContent = "Đăng câu hỏi";
                btnSubmitAsk.disabled = false;

                fetchQuestions();
                alert('Đăng câu hỏi thành công!');

            } catch (error) {
                console.error("Lỗi đăng bài: ", error);
                alert("Có lỗi xảy ra khi đăng bài. Vui lòng thử lại.");
                btnSubmitAsk.textContent = "Đăng câu hỏi";
                btnSubmitAsk.disabled = false;
            }
        });

        // Khởi động trang
        fetchQuestions();
    </script>
</body>
</html>
