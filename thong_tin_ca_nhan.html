<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thông tin cá nhân - ATherapyHub</title>
    <!-- Nhúng CSS dùng chung -->
    <link rel="stylesheet" href="style.css">
    <style>
        /* CSS riêng cho trang Thông tin cá nhân */
        .profile-wrapper {
            max-width: 600px;
            margin: 40px auto;
            background-color: var(--bg-card);
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.03);
            border: 1px solid var(--border-color);
        }

        .profile-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .profile-header h2 {
            color: var(--navy-primary);
            font-size: 24px;
            margin-bottom: 8px;
        }

        .profile-header p {
            color: var(--text-muted);
            font-size: 14px;
        }

        /* Tùy chỉnh input bị khóa (Readonly) */
        input:disabled {
            background-color: #F1F5F9;
            color: var(--text-muted);
            cursor: not-allowed;
            border-color: #E2E8F0;
        }

        #profile-message {
            text-align: center;
            margin-top: 15px;
            font-size: 14px;
            font-weight: 500;
        }

        @media (max-width: 768px) {
            .profile-wrapper {
                padding: 25px 20px;
                margin: 20px auto;
            }
        }
    </style>
</head>
<body>

    <main id="main-content">
        
        <div class="profile-wrapper">
            
            <!-- Cảnh báo chưa đăng nhập -->
            <div id="auth-warning" style="display: none; text-align: center; padding: 20px 0;">
                <h3 style="color: var(--danger); margin-bottom: 10px;">Yêu cầu Đăng nhập</h3>
                <p style="color: var(--text-muted); margin-bottom: 20px;">Vui lòng đăng nhập để xem và cập nhật thông tin cá nhân.</p>
                <button class="btn-primary" style="max-width: 250px;" onclick="document.getElementById('login-modal').style.display='flex'">Đăng nhập ngay</button>
            </div>

            <!-- Form cập nhật thông tin -->
            <div id="profile-form-section" style="display: none;">
                <div class="profile-header">
                    <h2>Hồ sơ cá nhân</h2>
                    <p>Quản lý thông tin hiển thị của bạn trên diễn đàn</p>
                </div>

                <div class="form-group">
                    <label>Email (Không thể thay đổi)</label>
                    <input type="email" id="profile-email" disabled>
                </div>
                <div class="form-group">
                    <label>Tên hiển thị (Tên người dùng)</label>
                    <input type="text" id="profile-name" placeholder="Ví dụ: Trần Minh Hoàng">
                </div>
                <div class="form-group">
                    <label>Số điện thoại</label>
                    <input type="tel" id="profile-phone" placeholder="Nhập số điện thoại liên hệ">
                </div>
                
                <button id="btn-save-profile" class="btn-primary" style="margin-top: 20px;">Lưu thay đổi</button>
                <div id="profile-message"></div>
            </div>

        </div>

    </main>

    <!-- Nạp Layout Header/Footer -->
    <script type="module" src="layout.js"></script>

    <!-- Script Firebase xử lý Hồ sơ -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { 
            getFirestore, doc, getDoc, setDoc, 
            collection, query, where, getDocs 
        } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBcC-sXCRnZ1eg9gzGR25HvaNi-B1P3Xuo",
            authDomain: "datatherapy-52437.firebaseapp.com",
            projectId: "datatherapy-52437",
            storageBucket: "datatherapy-52437.firebasestorage.app",
            messagingSenderId: "206559916642",
            appId: "1:206559916642:web:d4e911752ef2bb3b58973b"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        const authWarning = document.getElementById('auth-warning');
        const profileFormSection = document.getElementById('profile-form-section');
        const emailInput = document.getElementById('profile-email');
        const nameInput = document.getElementById('profile-name');
        const phoneInput = document.getElementById('profile-phone');
        const btnSave = document.getElementById('btn-save-profile');
        const messageBox = document.getElementById('profile-message');

        // Theo dõi trạng thái đăng nhập
        onAuthStateChanged(auth, async (user) => {
            if (!user) {
                authWarning.style.display = 'block';
                profileFormSection.style.display = 'none';
            } else {
                authWarning.style.display = 'none';
                profileFormSection.style.display = 'block';
                
                // Điền email từ Auth
                emailInput.value = user.email;

                // Lấy dữ liệu hồ sơ từ Firestore
                await loadUserProfile(user.uid);
            }
        });

        async function loadUserProfile(uid) {
            try {
                const userDocRef = doc(db, "users", uid);
                const userDocSnap = await getDoc(userDocRef);

                if (userDocSnap.exists()) {
                    const userData = userDocSnap.data();
                    nameInput.value = userData.displayName || "";
                    phoneInput.value = userData.phoneNumber || "";
                }
            } catch (error) {
                console.error("Lỗi khi tải thông tin:", error);
            }
        }

        // Xử lý lưu thông tin có check trùng lặp tên
        btnSave.addEventListener('click', async () => {
            const user = auth.currentUser;
            if (!user) return;

            const newName = nameInput.value.trim();
            const newPhone = phoneInput.value.trim();

            if (!newName) {
                showMessage("Vui lòng nhập tên hiển thị.", "var(--danger)");
                return;
            }

            btnSave.textContent = "Đang kiểm tra...";
            btnSave.disabled = true;

            try {
                // 1. KIỂM TRA TRÙNG LẶP TÊN NGƯỜI DÙNG
                // Quét qua collection 'users' xem có ai dùng tên này chưa
                const usersRef = collection(db, "users");
                const q = query(usersRef, where("displayName", "==", newName));
                const querySnapshot = await getDocs(q);

                let isDuplicate = false;
                querySnapshot.forEach((docSnap) => {
                    // Nếu tìm thấy tên này nhưng ID không phải của user hiện tại -> Bị trùng
                    if (docSnap.id !== user.uid) {
                        isDuplicate = true;
                    }
                });

                if (isDuplicate) {
                    showMessage("Tên người dùng này đã được sử dụng. Vui lòng chọn tên khác!", "var(--danger)");
                    btnSave.textContent = "Lưu thay đổi";
                    btnSave.disabled = false;
                    return; // Ngừng thực thi việc lưu
                }

                // 2. NẾU KHÔNG TRÙNG -> TIẾN HÀNH LƯU
                btnSave.textContent = "Đang lưu...";
                
                // Vẫn lưu UID vào tài liệu (implicit/ngầm) để Admin quản lý dù không hiện trên UI
                const userDocRef = doc(db, "users", user.uid);
                await setDoc(userDocRef, {
                    displayName: newName,
                    phoneNumber: newPhone,
                    email: user.email,
                    uid: user.uid, 
                    updatedAt: new Date()
                }, { merge: true });

                showMessage("Cập nhật thông tin thành công!", "#03543F");
                
            } catch (error) {
                console.error("Lỗi khi lưu thông tin:", error);
                showMessage("Có lỗi xảy ra. Vui lòng thử lại.", "var(--danger)");
            } finally {
                btnSave.textContent = "Lưu
