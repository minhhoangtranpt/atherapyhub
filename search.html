<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kết quả tìm kiếm - ATherapyHub</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* Mở rộng khung chứa đồng bộ với trang chủ */
        #main-content {
            max-width: 1400px;
            margin: 25px auto;
            padding: 0 20px;
        }

        .search-results-header {
            margin-bottom: 20px;
            padding-bottom: 12px;
            border-bottom: 2px solid var(--border-color);
        }

        .search-results-header h2 {
            margin: 0;
            color: var(--theme-primary);
            font-size: 20px;
        }
        
        .search-keyword {
            color: var(--accent-color);
            font-weight: 700;
        }

        .no-results {
            grid-column: 1 / -1;
            text-align: center;
            color: var(--text-muted);
            padding: 50px 20px;
            background-color: var(--bg-card);
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }

        /* Lưới 5 cột x 5 hàng trên máy tính */
        .article-grid-container { 
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 18px;
        }
        
        /* Thẻ bài viết (Card) */
        .article-card {
            background: var(--bg-card, #ffffff);
            border: 1px solid var(--border-color, #e2e8f0);
            border-radius: 10px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: transform 0.2s, border-color 0.2s, box-shadow 0.2s;
        }

        .article-card:hover {
            transform: translateY(-4px);
            border-color: var(--theme-secondary, #3b82f6);
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.06);
        }

        /* Khung trên cùng hiển thị Tên bài viết */
        .article-card-banner {
            min-height: 110px;
            padding: 15px;
            background: linear-gradient(135deg, var(--theme-primary, #1e3a8a), var(--theme-secondary, #2563eb));
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            color: #ffffff;
            border-bottom: 1px solid var(--border-color, #e2e8f0);
            flex: 1;
        }

        .banner-title {
            font-size: 15px;
            font-weight: 600;
            line-height: 1.45;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
            margin: 0;
        }

        .article-card-body {
            padding: 12px 15px 15px 15px;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            background: var(--bg-card, #ffffff);
        }

        .article-card-meta { 
            font-size: 11.5px;
            color: var(--text-muted, #64748b);
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        /* Nút bấm Xem chi tiết: Nền trắng, chữ xanh, viền xanh */
        .btn-detail {
            display: block;
            text-align: center;
            background-color: #ffffff;
            color: var(--theme-primary, #1e3a8a);
            border: 1.5px solid var(--theme-primary, #1e3a8a);
            text-decoration: none;
            padding: 7px 12px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 600;
            transition: all 0.2s;
        }

        .btn-detail:hover {
            background-color: var(--theme-light, #eff6ff);
            color: var(--theme-secondary, #2563eb);
            border-color: var(--theme-secondary, #2563eb);
        }

        /* Phân trang */
        .pagination { display: flex; justify-content: center; gap: 6px; margin-top: 30px; flex-wrap: wrap; }
        .page-btn {
            padding: 6px 12px; border: 1px solid var(--border-color); background-color: white;
            color: var(--text-main); border-radius: 4px; cursor: pointer; font-size: 13px; font-weight: 500;
        }
        .page-btn:hover { background-color: var(--theme-light); }
        .page-btn.active { background-color: var(--theme-primary); color: white; border-color: var(--theme-primary); }

        /* Tương thích màn hình nhỏ (Responsive) */
        @media (max-width: 1200px) {
            .article-grid-container { grid-template-columns: repeat(4, 1fr); }
        }
        @media (max-width: 992px) {
            .article-grid-container { grid-template-columns: repeat(3, 1fr); }
        }
        
        /* Giao diện Điện thoại & Máy tính bảng nhỏ: Thu gọn chiều dọc thẻ */
        @media (max-width: 768px) {
            #main-content { margin: 12px auto; padding: 0 10px; }
            .search-results-header { margin-bottom: 12px; padding-bottom: 8px; }
            .search-results-header h2 { font-size: 17px; }
            
            .article-grid-container { grid-template-columns: repeat(2, 1fr); gap: 10px; }
            
            .article-card { border-radius: 8px; }
            .article-card-banner { min-height: 75px; padding: 10px; }
            .banner-title { font-size: 13.5px; line-height: 1.35; -webkit-line-clamp: 3; }
            
            .article-card-body { padding: 8px 10px 10px 10px; }
            .article-card-meta { font-size: 10.5px; margin-bottom: 8px; }
            
            .btn-detail { 
                padding: 5px 10px; 
                font-size: 12px; 
                border-radius: 5px; 
            }
        }

        @media (max-width: 480px) {
            .article-grid-container { grid-template-columns: 1fr; gap: 10px; }
            .article-card-banner { min-height: 65px; padding: 12px; }
            .banner-title { -webkit-line-clamp: 2; }
        }
    </style>
</head>
<body>

    <main id="main-content">
        <div class="search-results-header">
            <h2>Kết quả tìm kiếm cho: "<span id="keyword-display" class="search-keyword">...</span>"</h2>
            <p id="result-count" style="color: var(--text-muted); font-size: 13.5px; margin-top: 5px;">Đang tìm kiếm dữ liệu...</p>
        </div>

        <!-- Vùng hiển thị kết quả dạng lưới -->
        <div id="results-container" class="article-grid-container"></div>

        <!-- Phân trang nếu kết quả > 25 bài -->
        <div id="pagination-container" class="pagination"></div>
    </main>

    <!-- Nhúng JS dạng module -->
    <script type="module" src="layout.js"></script>

    <!-- Script xử lý tìm kiếm với Firebase -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBcC-sXCRnZ1eg9gzGR25HvaNi-B1P3Xuo",
            authDomain: "datatherapy-52437.firebaseapp.com",
            projectId: "datatherapy-52437",
            storageBucket: "datatherapy-52437.firebasestorage.app",
            messagingSenderId: "206559916642",
            appId: "1:206559916642:web:d4e911752ef2bb3b58973b"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const keywordDisplay = document.getElementById('keyword-display');
        const resultsContainer = document.getElementById('results-container');
        const resultCount = document.getElementById('result-count');
        const paginationContainer = document.getElementById('pagination-container');

        let matchedArticles = [];
        let currentPage = 1;
        const itemsPerPage = 25; // 5 hàng x 5 cột = 25 bài viết mỗi trang

        // Loại bỏ dấu tiếng Việt để tìm kiếm không phân biệt dấu
        function removeVietnameseTones(str) {
            str = str.replace(/à|á|ạ|ả|ã|â|ầ|ấ|ậ|ẩ|ẫ|ă|ằ|ắ|ặ|ẳ|ẵ/g, "a");
            str = str.replace(/è|é|ẹ|ẻ|ẽ|ê|ề|ế|ệ|ể|ễ/g, "e");
            str = str.replace(/ì|í|ị|ỉ|ĩ/g, "i");
            str = str.replace(/ò|ó|ọ|ỏ|õ|ô|ồ|ố|ộ|ổ|ỗ|ơ|ờ|ớ|ợ|ở|ỡ/g, "o");
            str = str.replace(/ù|ú|ụ|ủ|ũ|ư|ừ|ứ|ự|ử|ữ/g, "u");
            str = str.replace(/ỳ|ý|ỵ|ỷ|ỹ/g, "y");
            str = str.replace(/đ/g, "d");
            str = str.replace(/À|Á|Ạ|Ả|Ã|Â|Ầ|Ấ|Ậ|Ẩ|Ẫ|Ă|Ằ|Ắ|Ặ|Ẳ|Ẵ/g, "A");
            str = str.replace(/È|É|Ẹ|Ẻ|Ẽ|Ê|Ề|Ế|Ệ|Ể|Ễ/g, "E");
            str = str.replace(/Ì|Í|Ị|Ỉ|Ĩ/g, "I");
            str = str.replace(/Ò|Ó|Ọ|Ỏ|Õ|Ô|Ồ|Ố|Ộ|Ổ|Ỗ|Ơ|Ờ|Ớ|Ợ|Ở|Ỡ/g, "O");
            str = str.replace(/Ù|Ú|Ụ|Ủ|Ũ|Ư|Ừ|Ứ|Ự|Ử|Ữ/g, "U");
            str = str.replace(/Ỳ|Ý|Ỵ|Ỷ|Ỹ/g, "Y");
            str = str.replace(/Đ/g, "D");
            return str.toLowerCase();
        }

        function renderSearchResults() {
            resultsContainer.innerHTML = '';
            const currentItems = matchedArticles.slice((currentPage - 1) * itemsPerPage, currentPage * itemsPerPage);

            currentItems.forEach(article => {
                const card = document.createElement('div');
                card.className = 'article-card';

                card.innerHTML = `
                    <div class="article-card-banner" title="${article.title}">
                        <div class="banner-title">${article.title}</div>
                    </div>
                    <div class="article-card-body">
                        <div class="article-card-meta">
                            <span>${article.date}</span>
                            <span>${article.viewCount} lượt xem</span>
                        </div>
                        <a href="chi_tiet.html?id=${article.id}" class="btn-detail">Xem chi tiết</a>
                    </div>
                `;
                resultsContainer.appendChild(card);
            });

            renderPagination();
        }

        function renderPagination() {
            paginationContainer.innerHTML = '';
            const totalPages = Math.ceil(matchedArticles.length / itemsPerPage);
            if (totalPages <= 1) return;
            
            for (let i = 1; i <= totalPages; i++) {
                const btn = document.createElement('button');
                btn.className = `page-btn ${i === currentPage ? 'active' : ''}`;
                btn.textContent = i;
                btn.addEventListener('click', () => { 
                    currentPage = i; 
                    renderSearchResults(); 
                    window.scrollTo({ top: 0, behavior: 'smooth' }); 
                });
                paginationContainer.appendChild(btn);
            }
        }

        document.addEventListener("DOMContentLoaded", async () => {
            const urlParams = new URLSearchParams(window.location.search);
            const keywordRaw = urlParams.get('q');

            if (!keywordRaw || keywordRaw.trim() === '') {
                keywordDisplay.textContent = "Trống";
                resultCount.textContent = "";
                resultsContainer.innerHTML = `
                    <div class="no-results">
                        <p>Vui lòng nhập từ khóa vào thanh tìm kiếm ở phía trên.</p>
                    </div>
                `;
                return;
            }

            const keywordStr = keywordRaw.trim();
            const keywordNormalized = removeVietnameseTones(keywordStr);
            keywordDisplay.textContent = keywordStr;

            try {
                // Tải danh sách bài viết từ bảng xem trước (vẫn quét cả tiêu đề lẫn nội dung snippet để tìm chính xác)
                const querySnapshot = await getDocs(collection(db, "article_snippets"));
                matchedArticles = [];

                querySnapshot.forEach((doc) => {
                    const data = doc.data();
                    const title = data.title || "Bài viết không có tiêu đề";
                    const snippetData = data.snippet || "";

                    const textToSearch = removeVietnameseTones(title + " " + snippetData);

                    if (textToSearch.includes(keywordNormalized)) {
                        let dateStr = "Vừa xong";
                        let createdTime = 0;
                        if (data.createdAt && data.createdAt.toDate) {
                            const dateObj = data.createdAt.toDate();
                            createdTime = dateObj.getTime();
                            dateStr = dateObj.toLocaleDateString('vi-VN');
                        }

                        matchedArticles.push({
                            id: doc.id,
                            title: title,
                            date: dateStr,
                            viewCount: data.viewCount || 0,
                            createdTime: createdTime
                        });
                    }
                });

                // Sắp xếp kết quả tìm kiếm mới nhất lên đầu
                matchedArticles.sort((a, b) => b.createdTime - a.createdTime);

                if (matchedArticles.length === 0) {
                    resultCount.textContent = `Tìm thấy 0 kết quả phù hợp.`;
                    resultsContainer.innerHTML = `
                        <div class="no-results">
                            <h3 style="color: var(--theme-primary); margin-bottom: 10px;">Không tìm thấy bài viết nào</h3>
                            <p>Rất tiếc, chúng tôi không tìm thấy nội dung phù hợp với từ khóa "<strong>${keywordStr}</strong>".<br>Vui lòng thử lại bằng các từ khóa khác ngắn gọn hơn.</p>
                        </div>
                    `;
                } else {
                    resultCount.textContent = `Tìm thấy ${matchedArticles.length} kết quả phù hợp.`;
                    currentPage = 1;
                    renderSearchResults();
                }

            } catch (error) {
                console.error("Lỗi tìm kiếm:", error);
                resultCount.textContent = "";
                resultsContainer.innerHTML = '<div class="no-results" style="color: var(--danger);">Đã xảy ra lỗi khi tìm kiếm. Vui lòng thử lại sau.</div>';
            }
        });
    </script>
</body>
</html>
