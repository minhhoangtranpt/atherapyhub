<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trang chủ - ATherapyHub</title>
    <!-- Nhúng CSS dùng chung -->
    <link rel="stylesheet" href="style.css">
    <style>
        /* Tùy chỉnh CSS riêng cho Trang Chủ */
        .welcome-banner {
            text-align: center;
            padding: 40px 20px;
            background: linear-gradient(135deg, var(--theme-primary), var(--theme-secondary));
            color: white;
            border-radius: 12px;
            margin-bottom: 40px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .welcome-banner h2 {
            font-size: 28px;
            margin-bottom: 10px;
            color: white;
        }

        .welcome-banner p {
            font-size: 15px;
            opacity: 0.9;
            max-width: 600px;
            margin: 0 auto;
        }

        /* Khu vực hiển thị theo Chuyên mục */
        .category-section {
            margin-bottom: 40px;
        }

        .category-title {
            font-size: 20px;
            color: var(--theme-primary);
            border-bottom: 2px solid var(--theme-primary);
            padding-bottom: 8px;
            margin-bottom: 20px;
            display: inline-block;
        }

        /* Lưới thẻ bài viết */
        .articles-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
        }

        .article-card {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            text-decoration: none;
            color: inherit;
            transition: background-color 0.2s, border-color 0.2s;
        }

        .article-card:hover {
            background-color: var(--theme-light);
            border-color: var(--theme-secondary);
        }

        .article-title {
            font-size: 16px;
            font-weight: 600;
            color: var(--theme-primary);
            margin-bottom: 10px;
            line-height: 1.4;
            /* Cắt text quá 2 dòng */
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .article-meta {
            font-size: 12px;
            color: var(--text-muted);
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .article-snippet {
            font-size: 14px;
            color: var(--text-main);
            line-height: 1.5;
            /* Cắt text quá 3 dòng */
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
            flex: 1; /* Đẩy nội dung chiếm hết khoảng trống */
        }
        
        .empty-message {
            text-align: center;
            padding: 40px;
            color: var(--text-muted);
            background: white;
            border: 1px dashed var(--border-color);
            border-radius: 8px;
        }

        @media (max-width: 768px) {
            .welcome-banner { padding: 30px 15px; border-radius: 8px; margin-bottom: 25px; }
            .welcome-banner h2 { font-size: 22px; }
            .articles-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <main id="main-content">
        
        <!-- Banner chào mừng -->
        <div class="welcome-banner">
            <h2>Chào mừng đến với ATherapyHub</h2>
            <p>Diễn đàn chia sẻ kiến thức lâm sàng, học thuật và nghiên cứu khoa học dành riêng cho cộng đồng nhà trị liệu.</p>
        </div>

        <!-- Khung chứa toàn bộ bài viết sẽ được JS render vào đây -->
        <div id="articles-container">
            <div style="text-align: center; color: var(--text-muted); padding: 40px;">Đang tải dữ liệu bài viết...</div>
        </div>

    </main>

    <!-- Nhúng JS dạng module để tự động gắn Header/Footer -->
    <script type="module" src="layout.js"></script>

    <!-- Script tải và gom nhóm bài viết từ Firebase -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, getDocs, query, orderBy } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBcC-sXCRnZ1eg9gzGR25HvaNi-B1P3Xuo",
            authDomain: "datatherapy-52437.firebaseapp.com",
            projectId: "datatherapy-52437",
            storageBucket: "datatherapy-52437.firebasestorage.app",
            messagingSenderId: "206559916642",
            appId: "1:206559916642:web:d4e911752ef2bb3b58973b"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const articlesContainer = document.getElementById('articles-container');

        // Hàm tiện ích: Loại bỏ thẻ HTML để tạo chuỗi xem trước (snippet)
        function stripHTML(html) {
            let tmp = document.createElement("DIV");
            tmp.innerHTML = html;
            return tmp.textContent || tmp.innerText || "";
        }

        async function fetchAndGroupArticles() {
            try {
                // Lấy tất cả bài viết, sắp xếp mới nhất lên đầu
                const q = query(collection(db, "articles"), orderBy("createdAt", "desc"));
                const querySnapshot = await getDocs(q);
                
                if (querySnapshot.empty) {
                    articlesContainer.innerHTML = '<div class="empty-message">Hiện tại chưa có bài viết nào trên hệ thống.</div>';
                    return;
                }

                // Object để gom nhóm bài viết theo chuyên mục
                // Ví dụ: { "Lâm sàng": [...], "Học thuật": [...] }
                const groupedArticles = {};

                querySnapshot.forEach((doc) => {
                    const data = doc.data();
                    const category = data.category || "Chưa phân loại";
                    
                    if (!groupedArticles[category]) {
                        groupedArticles[category] = [];
                    }

                    // Format ngày đăng
                    let dateStr = "";
                    if (data.createdAt && data.createdAt.toDate) {
                        const dateObj = data.createdAt.toDate();
                        dateStr = dateObj.toLocaleDateString('vi-VN');
                    }

                    // Tạo snippet nội dung (tối đa 150 ký tự)
                    let snippet = stripHTML(data.content);
                    if (snippet.length > 150) snippet = snippet.substring(0, 150) + "...";

                    groupedArticles[category].push({
                        id: doc.id,
                        title: data.title,
                        author: data.author,
                        date: dateStr,
                        snippet: snippet
                    });
                });

                // Render giao diện
                let finalHTML = '';

                // Duyệt qua từng chuyên mục đã gom nhóm
                for (const [categoryName, articlesList] of Object.entries(groupedArticles)) {
                    
                    let cardsHTML = '';
                    articlesList.forEach(article => {
                        // Link tới trang chi tiết bài viết (chi_tiet.html)
                        cardsHTML += `
                            <a href="chi_tiet.html?id=${article.id}" class="article-card">
                                <div class="article-title">${article.title}</div>
                                <div class="article-meta">
                                    <span>👤 ${article.author}</span>
                                    <span>•</span>
                                    <span>📅 ${article.date}</span>
                                </div>
                                <div class="article-snippet">${article.snippet}</div>
                            </a>
                        `;
                    });

                    // Bọc các thẻ bài viết vào một Section Chuyên mục
                    finalHTML += `
                        <div class="category-section">
                            <h3 class="category-title">${categoryName}</h3>
                            <div class="articles-grid">
                                ${cardsHTML}
                            </div>
                        </div>
                    `;
                }

                articlesContainer.innerHTML = finalHTML;

            } catch (error) {
                console.error("Lỗi lấy bài viết:", error);
                articlesContainer.innerHTML = '<div class="empty-message" style="color: var(--danger);">Không thể tải dữ liệu bài viết lúc này.</div>';
            }
        }

        // Gọi hàm khi trang tải xong
        fetchAndGroupArticles();
    </script>
</body>
</html>
