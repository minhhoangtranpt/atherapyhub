<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trang chủ - ATherapyHub</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* Mở rộng khung chứa để đủ không gian cho 5 cột thoáng đãng */
        #main-content {
            max-width: 1400px;
            margin: 25px auto;
            padding: 0 20px;
        }

        .list-header-section {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 20px; border-bottom: 2px solid var(--border-color); padding-bottom: 12px;
            flex-wrap: wrap; gap: 10px;
        }
        
        .list-header-section h3 { margin: 0; color: var(--theme-primary); font-size: 18px; }
        
        .header-actions { display: flex; align-items: center; gap: 15px; flex-wrap: wrap; }
        .filter-group { display: flex; gap: 8px; align-items: center; }

        .sort-select {
            padding: 6px 10px; border-radius: 6px; border: 1px solid var(--border-color);
            background-color: var(--bg-body); color: var(--text-main); font-size: 13px;
            font-family: inherit; outline: none; cursor: pointer;
        }
        .sort-select:focus { border-color: var(--theme-secondary); }

        /* Lưới 5 cột x 5 hàng trên máy tính */
        .article-grid-container { 
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 18px;
        }
        
        /* Thẻ bài viết (Card) */
        .article-card {
            background: var(--bg-card, #ffffff);
            border: 1px solid var(--border-color, #e2e8f0);
            border-radius: 10px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: transform 0.2s, border-color 0.2s, box-shadow 0.2s;
        }

        .article-card:hover {
            transform: translateY(-4px);
            border-color: var(--theme-secondary, #3b82f6);
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.06);
        }

        /* Khung trên cùng hiển thị Tên bài viết */
        .article-card-banner {
            min-height: 110px;
            padding: 15px;
            background: linear-gradient(135deg, var(--theme-primary, #1e3a8a), var(--theme-secondary, #2563eb));
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            color: #ffffff;
            border-bottom: 1px solid var(--border-color, #e2e8f0);
            flex: 1;
        }

        .banner-title {
            font-size: 15px;
            font-weight: 600;
            line-height: 1.45;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
            margin: 0;
        }

        .article-card-body {
            padding: 12px 15px 15px 15px;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            background: var(--bg-card, #ffffff);
        }

        .article-card-meta { 
            font-size: 11.5px;
            color: var(--text-muted, #64748b);
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        /* Nút bấm Xem chi tiết: Nền trắng, chữ xanh, viền xanh */
        .btn-detail {
            display: block;
            text-align: center;
            background-color: #ffffff;
            color: var(--theme-primary, #1e3a8a);
            border: 1.5px solid var(--theme-primary, #1e3a8a);
            text-decoration: none;
            padding: 7px 12px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 600;
            transition: all 0.2s;
        }

        .btn-detail:hover {
            background-color: var(--theme-light, #eff6ff);
            color: var(--theme-secondary, #2563eb);
            border-color: var(--theme-secondary, #2563eb);
        }

        /* Phân trang */
        .pagination { display: flex; justify-content: center; gap: 6px; margin-top: 30px; flex-wrap: wrap; }
        .page-btn {
            padding: 6px 12px; border: 1px solid var(--border-color); background-color: white;
            color: var(--text-main); border-radius: 4px; cursor: pointer; font-size: 13px; font-weight: 500;
        }
        .page-btn:hover { background-color: var(--theme-light); }
        .page-btn.active { background-color: var(--theme-primary); color: white; border-color: var(--theme-primary); }

        .empty-message { 
            grid-column: 1 / -1; 
            text-align: center; padding: 40px; color: var(--text-muted); font-size: 14px; 
            background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 8px;
        }

        /* Tương thích màn hình nhỏ (Responsive) */
        @media (max-width: 1200px) {
            .article-grid-container { grid-template-columns: repeat(4, 1fr); }
        }
        @media (max-width: 992px) {
            .article-grid-container { grid-template-columns: repeat(3, 1fr); }
        }
        
        /* Giao diện Điện thoại & Máy tính bảng nhỏ: Thu gọn chiều dọc thẻ */
        @media (max-width: 768px) {
            #main-content { margin: 12px auto; padding: 0 10px; }
            .list-header-section { flex-direction: column; align-items: flex-start; gap: 8px; margin-bottom: 12px; padding-bottom: 8px; }
            .header-actions { width: 100%; justify-content: space-between; }
            .filter-group { flex: 1; }
            
            .article-grid-container { grid-template-columns: repeat(2, 1fr); gap: 10px; }
            
            .article-card { border-radius: 8px; }
            .article-card-banner { min-height: 75px; padding: 10px; }
            .banner-title { font-size: 13.5px; line-height: 1.35; -webkit-line-clamp: 3; }
            
            .article-card-body { padding: 8px 10px 10px 10px; }
            .article-card-meta { font-size: 10.5px; margin-bottom: 8px; }
            
            .btn-detail { 
                padding: 5px 10px; 
                font-size: 12px; 
                border-radius: 5px; 
            }
        }

        @media (max-width: 480px) {
            .article-grid-container { grid-template-columns: 1fr; gap: 10px; }
            .article-card-banner { min-height: 65px; padding: 12px; }
            .banner-title { -webkit-line-clamp: 2; }
        }
    </style>
</head>
<body>

    <main id="main-content">

        <div class="list-header-section">
            <h3>Bài viết mới nhất</h3>
            <div class="header-actions">
                <div class="filter-group">
                    <select id="sort-by" class="sort-select">
                        <option value="date">Ngày đăng</option>
                        <option value="views">Lượt xem</option>
                    </select>
                    <select id="sort-order" class="sort-select">
                        <option value="desc">Mới - Cũ</option>
                        <option value="asc">Cũ - Mới</option>
                    </select>
                </div>
            </div>
        </div>

        <div id="articles-list-container" class="article-grid-container">
            <div class="empty-message">Đang tải dữ liệu bài viết...</div>
        </div>

        <div id="pagination-container" class="pagination"></div>

    </main>

    <script type="module" src="layout.js"></script>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, getDocs, query } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBcC-sXCRnZ1eg9gzGR25HvaNi-B1P3Xuo",
            authDomain: "datatherapy-52437.firebaseapp.com",
            projectId: "datatherapy-52437",
            storageBucket: "datatherapy-52437.firebasestorage.app",
            messagingSenderId: "206559916642",
            appId: "1:206559916642:web:d4e911752ef2bb3b58973b"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const articlesContainer = document.getElementById('articles-list-container');
        const paginationContainer = document.getElementById('pagination-container');
        const sortBySelect = document.getElementById('sort-by');
        const sortOrderSelect = document.getElementById('sort-order');

        let allArticles = [];
        let currentPage = 1;
        const itemsPerPage = 25; // 5 hàng x 5 cột = 25 bài viết mỗi trang

        sortBySelect.addEventListener('change', () => {
            if (sortBySelect.value === 'date') {
                sortOrderSelect.options[0].text = 'Mới - Cũ';
                sortOrderSelect.options[1].text = 'Cũ - Mới';
            } else {
                sortOrderSelect.options[0].text = 'Cao - Thấp';
                sortOrderSelect.options[1].text = 'Thấp - Cao';
            }
            sortAndRenderArticles();
        });

        sortOrderSelect.addEventListener('change', sortAndRenderArticles);

        async function fetchArticles() {
            try {
                const q = query(collection(db, "article_snippets"));
                const querySnapshot = await getDocs(q);
                
                allArticles = [];
                querySnapshot.forEach((doc) => {
                    const data = doc.data();
                    let dateStr = "Vừa xong";
                    let createdTime = 0;

                    if (data.createdAt && data.createdAt.toDate) {
                        const dateObj = data.createdAt.toDate();
                        createdTime = dateObj.getTime();
                        dateStr = dateObj.toLocaleDateString('vi-VN');
                    }

                    allArticles.push({
                        id: doc.id,
                        title: data.title || "Bài viết không có tiêu đề",
                        date: dateStr,
                        viewCount: data.viewCount || 0,
                        createdTime: createdTime
                    });
                });

                sortAndRenderArticles();

            } catch (error) {
                console.error("Lỗi lấy bài viết:", error);
                articlesContainer.innerHTML = '<div class="empty-message" style="color: var(--danger);">Không thể tải dữ liệu bài viết lúc này.</div>';
            }
        }

        function sortAndRenderArticles() {
            const sortBy = sortBySelect.value;
            const sortOrder = sortOrderSelect.value;
            
            allArticles.sort((a, b) => {
                if (sortBy === 'date') {
                    return sortOrder === 'desc' ? b.createdTime - a.createdTime : a.createdTime - b.createdTime;
                } else if (sortBy === 'views') {
                    return sortOrder === 'desc' ? b.viewCount - a.viewCount : a.viewCount - b.viewCount;
                }
            });

            currentPage = 1;
            renderArticleList();
        }

        function renderArticleList() {
            articlesContainer.innerHTML = '';
            
            if (allArticles.length === 0) {
                articlesContainer.innerHTML = '<div class="empty-message">Hiện tại chưa có bài viết nào trên hệ thống.</div>';
                paginationContainer.innerHTML = ''; 
                return;
            }

            const currentItems = allArticles.slice((currentPage - 1) * itemsPerPage, currentPage * itemsPerPage);

            currentItems.forEach(article => {
                const card = document.createElement('div');
                card.className = 'article-card';

                card.innerHTML = `
                    <div class="article-card-banner" title="${article.title}">
                        <div class="banner-title">${article.title}</div>
                    </div>
                    <div class="article-card-body">
                        <div class="article-card-meta">
                            <span>${article.date}</span>
                            <span>${article.viewCount} lượt xem</span>
                        </div>
                        <a href="chi_tiet.html?id=${article.id}" class="btn-detail">Xem chi tiết</a>
                    </div>
                `;
                
                articlesContainer.appendChild(card);
            });
            renderPagination();
        }

        function renderPagination() {
            paginationContainer.innerHTML = '';
            const totalPages = Math.ceil(allArticles.length / itemsPerPage);
            if (totalPages <= 1) return;
            
            for (let i = 1; i <= totalPages; i++) {
                const btn = document.createElement('button');
                btn.className = `page-btn ${i === currentPage ? 'active' : ''}`;
                btn.textContent = i;
                btn.addEventListener('click', () => { 
                    currentPage = i; 
                    renderArticleList(); 
                    window.scrollTo({ top: 0, behavior: 'smooth' }); 
                });
                paginationContainer.appendChild(btn);
            }
        }

        fetchArticles();
    </script>
</body>
</html>
