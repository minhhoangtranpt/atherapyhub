<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ATherapyHub</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        
        :root { 
            --primary: #3B82F6; --primary-hover: #2563EB; 
            --bg-body: #F9FAFB; --bg-card: #FFFFFF; 
            --text-main: #111827; --text-muted: #6B7280; 
            --border-color: #E5E7EB; --danger: #EF4444; 
        }

        body { font-family: 'Inter', sans-serif; background-color: var(--bg-body); color: var(--text-main); margin: 0; padding: 0; line-height: 1.6; }

        /* Header Tối giản */
        header { background-color: rgba(255, 255, 255, 0.9); backdrop-filter: blur(8px); padding: 16px 5%; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-color); position: sticky; top: 0; z-index: 100; }
        header h1 { margin: 0; font-size: 22px; color: var(--text-main); font-weight: 700; letter-spacing: -0.5px; }
        
        .user-controls { display: flex; align-items: center; gap: 12px; }
        #user-email-display { font-size: 14px; color: var(--text-muted); font-weight: 500; }
        @media (max-width: 600px) { #user-email-display { display: none; } }
        
        button, .btn-link { font-family: inherit; cursor: pointer; border: none; border-radius: 99px; font-weight: 600; transition: all 0.2s ease; text-decoration: none; display: inline-flex; align-items: center; justify-content: center; }
        .btn-logout { background-color: var(--bg-body); color: var(--text-main); padding: 8px 16px; font-size: 14px; border: 1px solid var(--border-color); }
        .btn-logout:hover { background-color: #F3F4F6; color: var(--danger); }
        .btn-create { background-color: var(--text-main); color: white; padding: 8px 20px; font-size: 14px; }
        .btn-create:hover { background-color: #374151; }
        .btn-login-nav { background-color: var(--primary); color: white; padding: 8px 20px; font-size: 14px; }
        .btn-login-nav:hover { background-color: var(--primary-hover); }

        /* Modal Dùng Chung */
        .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(17, 24, 39, 0.4); backdrop-filter: blur(4px); justify-content: center; align-items: center; z-index: 1000; padding: 20px; }
        .modal-box { background: var(--bg-card); padding: 32px; border-radius: 24px; width: 100%; max-width: 380px; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.1); position: relative; }
        .modal-box h2 { text-align: center; color: var(--text-main); margin-top: 0; margin-bottom: 24px; font-size: 20px; letter-spacing: -0.5px; }
        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; margin-bottom: 6px; font-weight: 500; font-size: 14px; color: var(--text-muted); }
        .form-group input { width: 100%; padding: 12px 16px; border: 1px solid var(--border-color); border-radius: 12px; box-sizing: border-box; font-size: 15px; background: #F9FAFB; transition: border 0.2s; }
        .form-group input:focus { outline: none; border-color: var(--primary); background: white; }
        .btn-primary { width: 100%; padding: 14px; background-color: var(--primary); color: white; font-size: 15px; border-radius: 12px; margin-top: 10px; }
        .btn-close-modal { position: absolute; top: 16px; right: 16px; background: #F3F4F6; border: none; width: 32px; height: 32px; border-radius: 50%; font-size: 16px; color: var(--text-muted); cursor: pointer; display: flex; align-items: center; justify-content: center; }
        .btn-close-modal:hover { background: #E5E7EB; color: var(--text-main); }

        #main-content { max-width: 1200px; margin: 40px auto; padding: 0 5%; }
        .content-header { display: flex; justify-content: center; margin-bottom: 40px; }
        .search-box { position: relative; width: 100%; max-width: 480px; }
        .search-box input { width: 100%; padding: 14px 20px 14px 45px; border: 1px solid var(--border-color); border-radius: 99px; font-size: 15px; box-sizing: border-box; outline: none; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.02); transition: all 0.2s; }
        .search-box input:focus { box-shadow: 0 10px 15px -3px rgba(0,0,0,0.05); border-color: #D1D5DB; }
        .search-icon { position: absolute; left: 18px; top: 50%; transform: translateY(-50%); color: var(--text-muted); font-size: 16px; }

        .articles-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 24px; }
        .status-state { text-align: center; padding: 60px 20px; color: var(--text-muted); font-size: 15px; background: transparent; grid-column: 1 / -1; }

        /* Card Hiện đại */
        .card { background: var(--bg-card); border-radius: 20px; box-shadow: 0 4px 20px rgba(0,0,0,0.03); display: flex; flex-direction: column; padding: 28px; transition: transform 0.3s ease, box-shadow 0.3s ease; border: 1px solid rgba(0,0,0,0.02); }
        .card:hover { transform: translateY(-4px); box-shadow: 0 12px 30px rgba(0,0,0,0.06); }
        .card-title { margin: 0 0 12px 0; font-size: 19px; color: var(--text-main); line-height: 1.4; letter-spacing: -0.3px; }
        .card-desc { font-size: 15px; color: var(--text-muted); margin-bottom: 24px; flex: 1; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; line-height: 1.6; }
        
        .card-actions { display: flex; gap: 8px; margin-top: auto; }
        .btn-view { flex: 1; background: #F3F4F6; color: var(--text-main); padding: 10px; border-radius: 12px; font-size: 14px; font-weight: 600; }
        .btn-view:hover { background: #E5E7EB; }
        .btn-edit { flex: none; width: 44px; background: #FFF7ED; color: #EA580C; padding: 0; }
        .btn-edit:hover { background: #FFEDD5; }
        .btn-delete { flex: none; width: 44px; background: #FEF2F2; color: #DC2626; padding: 0; }
        .btn-delete:hover { background: #FEE2E2; }

        /* Xác nhận mã xóa */
        .code-display { font-size: 24px; font-weight: 700; text-align: center; letter-spacing: 4px; color: var(--danger); margin: 15px 0; background: #FEF2F2; padding: 10px; border-radius: 12px; }

        .hidden { display: none !important; }
    </style>
</head>
<body>

    <header>
        <h1>ATherapyHub</h1>
        <div class="user-controls">
            <a href="admin.html" id="btn-create-post" class="btn-link btn-create hidden">Đăng bài mới</a>
            <span id="user-email-display" class="hidden"></span>
            <button id="logout-btn" class="btn-logout hidden">Đăng xuất</button>
            <button id="open-login-modal" class="btn-login-nav">Đăng nhập</button>
        </div>
    </header>

    <!-- Modal Đăng Nhập -->
    <div id="login-modal" class="modal-overlay">
        <div class="modal-box">
            <button id="close-login-modal" class="btn-close-modal">&times;</button>
            <h2>Đăng Nhập Quản Trị</h2>
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="email" placeholder="Nhập email" required>
            </div>
            <div class="form-group">
                <label>Mật khẩu</label>
                <input type="password" id="password" placeholder="Nhập mật khẩu" required>
            </div>
            <button id="login-btn" class="btn-primary">Đăng nhập</button>
            <div id="error-msg" style="color: var(--danger); text-align: center; margin-top: 16px; font-size: 14px;"></div>
        </div>
    </div>

    <!-- Modal Xác Nhận Xóa -->
    <div id="delete-modal" class="modal-overlay">
        <div class="modal-box">
            <button id="close-delete-modal" class="btn-close-modal">&times;</button>
            <h2>Xác nhận xóa bài</h2>
            <p style="text-align: center; font-size: 14px; color: var(--text-muted); margin-bottom: 5px;">Nhập dãy số dưới đây để xác nhận xóa vĩnh viễn bài viết này.</p>
            <div id="delete-code-display" class="code-display">0000</div>
            <div class="form-group">
                <input type="text" id="delete-code-input" placeholder="Nhập mã 4 số..." maxlength="4" style="text-align: center; font-size: 18px; font-weight: 600; letter-spacing: 2px;">
            </div>
            <button id="confirm-delete-btn" class="btn-primary" style="background-color: var(--danger);">Xóa bài viết</button>
        </div>
    </div>

    <div id="main-content">
        <div class="content-header">
            <div class="search-box">
                <span class="search-icon">🔍</span>
                <input type="text" id="search-input" placeholder="Tìm kiếm">
            </div>
        </div>
        <div id="articles-grid" class="articles-grid">
            <div class="status-state">Đang tải dữ liệu...</div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        // Import thêm deleteDoc và doc để xóa bài
        import { getFirestore, collection, getDocs, query, orderBy, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBcC-sXCRnZ1eg9gzGR25HvaNi-B1P3Xuo",
            authDomain: "datatherapy-52437.firebaseapp.com",
            projectId: "datatherapy-52437",
            storageBucket: "datatherapy-52437.firebasestorage.app",
            messagingSenderId: "206559916642",
            appId: "1:206559916642:web:d4e911752ef2bb3b58973b"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let allArticles = [];
        let isLoggedIn = false; 

        // Các biến phục vụ việc XÓA
        let articleToDelete = null;
        let expectedDeleteCode = "";

        const articlesGrid = document.getElementById('articles-grid');
        const loginModal = document.getElementById('login-modal');
        const deleteModal = document.getElementById('delete-modal');

        // Đóng/Mở Modal Đăng nhập
        document.getElementById('open-login-modal').addEventListener('click', () => { loginModal.style.display = 'flex'; });
        document.getElementById('close-login-modal').addEventListener('click', () => { loginModal.style.display = 'none'; });
        
        // Đóng Modal Xóa
        document.getElementById('close-delete-modal').addEventListener('click', () => { deleteModal.style.display = 'none'; });

        // Hàm gọi khi bấm nút Xóa ở 1 bài viết
        window.openDeleteModal = function(id) {
            articleToDelete = id;
            expectedDeleteCode = Math.floor(1000 + Math.random() * 9000).toString(); // Tạo mã 4 số ngẫu nhiên
            document.getElementById('delete-code-display').textContent = expectedDeleteCode;
            document.getElementById('delete-code-input').value = "";
            deleteModal.style.display = 'flex';
        }

        // Xử lý Xóa khi bấm xác nhận
        document.getElementById('confirm-delete-btn').addEventListener('click', async () => {
            const inputCode = document.getElementById('delete-code-input').value.trim();
            if (inputCode === expectedDeleteCode) {
                document.getElementById('confirm-delete-btn').textContent = "Đang xóa...";
                try {
                    await deleteDoc(doc(db, "articles", articleToDelete));
                    deleteModal.style.display = 'none';
                    document.getElementById('confirm-delete-btn').textContent = "Xóa bài viết";
                    fetchArticles(); // Tải lại danh sách
                } catch (error) {
                    alert("Lỗi khi xóa: " + error.message);
                    document.getElementById('confirm-delete-btn').textContent = "Xóa bài viết";
                }
            } else {
                alert("Mã xác nhận không khớp. Vui lòng nhập đúng 4 số trên màn hình.");
            }
        });

        function renderArticles(articlesToRender) {
            articlesGrid.innerHTML = ''; 
            if (articlesToRender.length === 0) {
                articlesGrid.innerHTML = '<div class="status-state">Trống. Không tìm thấy bài viết nào.</div>';
                return;
            }
            
            articlesToRender.forEach((article) => {
                const card = document.createElement('div');
                card.className = 'card';
                
                // Nếu đăng nhập thì hiện Sửa và Xóa (gọi hàm window.openDeleteModal)
                let adminButtons = isLoggedIn ? `
                    <a href="admin.html?id=${article.id}" class="btn-link btn-edit" title="Sửa bài">✏️</a>
                    <button onclick="window.openDeleteModal('${article.id}')" class="btn-delete" title="Xóa bài">🗑️</button>
                ` : '';

                card.innerHTML = `
                    <h3 class="card-title">${article.title}</h3>
                    <p class="card-desc">${article.description || ''}</p>
                    <div class="card-actions">
                        <a href="article.html?id=${article.id}" class="btn-link btn-view">Đọc chi tiết</a>
                        ${adminButtons}
                    </div>
                `;
                articlesGrid.appendChild(card);
            });
        }

        async function fetchArticles() {
            articlesGrid.innerHTML = '<div class="status-state">Đang tải dữ liệu...</div>';
            try {
                const q = query(collection(db, "articles"), orderBy("createdAt", "desc"));
                const querySnapshot = await getDocs(q);
                allArticles = [];
                querySnapshot.forEach((doc) => {
                    allArticles.push({ id: doc.id, ...doc.data() });
                });
                renderArticles(allArticles); 
            } catch (error) {
                articlesGrid.innerHTML = `<div class="status-state" style="color: var(--danger);">Lỗi tải dữ liệu: ${error.message}</div>`;
            }
        }

        document.getElementById('search-input').addEventListener('input', (e) => {
            const keyword = e.target.value.toLowerCase().trim();
            const filteredArticles = allArticles.filter(article => {
                return article.title && article.title.toLowerCase().includes(keyword);
            });
            renderArticles(filteredArticles);
        });

        onAuthStateChanged(auth, (user) => {
            const userEmailDisplay = document.getElementById('user-email-display');
            const logoutBtn = document.getElementById('logout-btn');
            const openLoginBtn = document.getElementById('open-login-modal');
            const btnCreatePost = document.getElementById('btn-create-post');

            if (user) {
                isLoggedIn = true;
                loginModal.style.display = 'none';
                userEmailDisplay.textContent = user.email;
                userEmailDisplay.classList.remove('hidden');
                logoutBtn.classList.remove('hidden');
                openLoginBtn.classList.add('hidden');
                btnCreatePost.classList.remove('hidden'); 
            } else {
                isLoggedIn = false;
                userEmailDisplay.classList.add('hidden');
                logoutBtn.classList.add('hidden');
                openLoginBtn.classList.remove('hidden');
                btnCreatePost.classList.add('hidden');
            }
            fetchArticles();
        });

        document.getElementById('login-btn').addEventListener('click', () => {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            document.getElementById('error-msg').textContent = "Đang xử lý...";

            signInWithEmailAndPassword(auth, email, password)
                .then(() => { document.getElementById('error-msg').textContent = ""; })
                .catch(() => { document.getElementById('error-msg').textContent = "Sai email hoặc mật khẩu!"; });
        });
        
        document.getElementById('password').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') document.getElementById('login-btn').click();
        });

        document.getElementById('logout-btn').addEventListener('click', () => signOut(auth));
    </script>
</body>
</html>
