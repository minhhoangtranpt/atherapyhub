<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chi tiết Hỏi & Đáp - ATherapyHub</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* Giao diện Phẳng - Tối ưu diện tích */
        .question-box {
            background-color: var(--bg-card);
            padding: 20px;
            border-radius: 8px;
            box-shadow: none; 
            margin-bottom: 20px;
            border: 1px solid var(--border-color);
        }

        .question-title {
            font-size: 20px;
            color: var(--navy-primary);
            margin-bottom: 10px;
            line-height: 1.3;
        }

        .post-meta {
            font-size: 12px;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 15px;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--border-color);
            flex-wrap: wrap;
        }

        .question-content {
            font-size: 15px;
            line-height: 1.6;
            text-align: justify;
            white-space: pre-wrap; 
        }

        .attached-image {
            max-width: 100%;
            max-height: 400px;
            border-radius: 6px;
            margin-top: 15px;
            border: 1px solid var(--border-color);
            object-fit: contain;
        }

        /* Nút xóa bài viết gốc */
        .btn-delete-action {
            background: none;
            border: none;
            color: var(--danger);
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            text-decoration: underline;
            padding: 0;
        }

        /* Khu vực Trả lời */
        .replies-section-title {
            font-size: 16px;
            color: var(--navy-secondary);
            margin-bottom: 15px;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 8px;
            font-weight: 600;
        }

        .reply-card {
            background-color: white;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            margin-bottom: 10px;
            transition: background-color 0.4s ease; 
        }

        .sub-reply-card {
            margin-left: 30px;
            background-color: #F8FAFC;
            border-left: 3px solid var(--accent-blue);
        }

        .reply-meta {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            font-size: 12px;
            align-items: center;
        }

        .reply-author {
            font-weight: 600;
            color: var(--navy-primary);
        }

        .reply-content {
            font-size: 14px;
            line-height: 1.5;
            white-space: pre-wrap;
            color: var(--text-main);
        }

        .reply-reference {
            background-color: var(--bg-body);
            border-left: 3px solid var(--accent-blue);
            padding: 8px 12px;
            border-radius: 0 6px 6px 0;
            font-size: 13px;
            color: var(--text-muted);
            margin-bottom: 10px;
            cursor: pointer;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            transition: background-color 0.2s;
        }

        .reply-reference:hover {
            background-color: #E2E8F0;
        }

        .reply-reference strong {
            color: var(--navy-primary);
        }

        .reply-actions-row {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-top: 10px;
        }

        .btn-reply-action {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            padding: 0;
            transition: color 0.2s;
        }

        .btn-reply-action:hover {
            color: var(--navy-primary);
            text-decoration: underline;
        }

        /* Nút xóa câu trả lời */
        .btn-reply-delete {
            background: none;
            border: none;
            color: var(--danger);
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            padding: 0;
            transition: color 0.2s;
        }
        
        .btn-reply-delete:hover {
            text-decoration: underline;
        }

        /* Form nhập câu trả lời */
        .reply-form-container {
            margin-top: 20px;
            background-color: var(--navy-light);
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #BFDBFE;
        }

        .reply-textarea {
            width: 100%;
            height: 80px;
            padding: 10px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            resize: vertical;
            font-family: inherit;
            font-size: 14px;
            margin-bottom: 10px;
        }

        .reply-textarea:focus {
            outline: none;
            border-color: var(--navy-secondary);
        }

        .btn-back {
            display: inline-block;
            margin-bottom: 15px;
            color: var(--text-muted);
            text-decoration: none;
            font-weight: 500;
            font-size: 13px;
        }

        .btn-back:hover {
            color: var(--navy-primary);
        }

        @media (max-width: 768px) {
            #main-content { margin: 15px auto; padding: 0 10px; }
            .question-box { padding: 15px; }
            .reply-card { padding: 12px; }
            .sub-reply-card { margin-left: 20px; }
        }
    </style>
</head>
<body>

    <main id="main-content">
        
        <a href="hoi_dap.html" class="btn-back">← Quay lại danh sách Hỏi & Đáp</a>

        <!-- Cảnh báo chưa đăng nhập -->
        <div id="auth-warning" style="display: none; text-align: center; padding: 40px 20px; background: white; border-radius: 8px; border: 1px solid var(--border-color);">
            <h3 style="color: var(--danger); margin-bottom: 10px;">Yêu cầu Đăng nhập</h3>
            <p style="color: var(--text-muted); margin-bottom: 20px; font-size: 14px;">Bạn cần đăng nhập để xem chi tiết và thảo luận trong bài viết này.</p>
            <button class="btn-primary" style="max-width: 200px; padding: 8px;" onclick="document.getElementById('login-modal').style.display='flex'">Đăng nhập ngay</button>
        </div>

        <div id="qa-content-wrapper" style="display: none;">
            
            <div id="question-container" class="question-box">
                <div style="text-align: center; color: var(--text-muted); font-size: 14px;">Đang tải nội dung câu hỏi...</div>
            </div>

            <div id="replies-section">
                <div class="replies-section-title">
                    Các câu trả lời (<span id="replies-count">0</span>)
                </div>
                
                <div id="replies-list"></div>

                <div class="reply-form-container">
                    <h4 style="margin-top: 0; margin-bottom: 10px; font-size: 14px; color: var(--navy-primary);">Viết câu trả lời của bạn</h4>
                    <textarea id="reply-input" class="reply-textarea" placeholder="Chia sẻ kiến thức hoặc kinh nghiệm của bạn..."></textarea>
                    <button id="btn-submit-reply" class="btn-primary" style="width: auto; padding: 8px 20px; font-size: 13px;">Gửi trả lời</button>
                </div>
            </div>

        </div>

    </main>

    <script type="module" src="layout.js"></script>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { 
            getFirestore, doc, getDoc, collection, addDoc, getDocs, 
            query, orderBy, serverTimestamp, updateDoc, increment, setDoc, deleteDoc
        } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBcC-sXCRnZ1eg9gzGR25HvaNi-B1P3Xuo",
            authDomain: "datatherapy-52437.firebaseapp.com",
            projectId: "datatherapy-52437",
            storageBucket: "datatherapy-52437.firebasestorage.app",
            messagingSenderId: "206559916642",
            appId: "1:206559916642:web:d4e911752ef2bb3b58973b"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        const urlParams = new URLSearchParams(window.location.search);
        const questionId = urlParams.get('id');

        const authWarning = document.getElementById('auth-warning');
        const qaContentWrapper = document.getElementById('qa-content-wrapper');
        const questionContainer = document.getElementById('question-container');
        const repliesList = document.getElementById('replies-list');
        const repliesCountDisplay = document.getElementById('replies-count');
        const btnSubmitReply = document.getElementById('btn-submit-reply');
        const replyInput = document.getElementById('reply-input');

        let currentAuthorName = null; 
        let currentUserUid = null;

        onAuthStateChanged(auth, async (user) => {
            if (!user) {
                authWarning.style.display = 'block';
                qaContentWrapper.style.display = 'none';
                currentAuthorName = null;
                currentUserUid = null;
            } else {
                authWarning.style.display = 'none';
                qaContentWrapper.style.display = 'block';
                currentUserUid = user.uid;
                
                try {
                    const userDocRef = doc(db, "users", user.uid);
                    const userDocSnap = await getDoc(userDocRef);
                    if (userDocSnap.exists() && userDocSnap.data().displayName && userDocSnap.data().displayName.trim() !== '') {
                        currentAuthorName = userDocSnap.data().displayName;
                    }
                } catch (error) {
                    console.error("Lỗi lấy thông tin user:", error);
                }

                if (questionId) {
                    loadQuestionData();
                    loadRepliesData();
                } else {
                    questionContainer.innerHTML = '<h3 style="color:var(--danger); text-align:center;">Lỗi: Không tìm thấy ID bài viết.</h3>';
                }
            }
        });

        async function loadQuestionData() {
            try {
                const docRef = doc(db, "hoi_dap", questionId);
                const docSnap = await getDoc(docRef);

                if (docSnap.exists()) {
                    const data = docSnap.data();
                    let dateStr = "";
                    if (data.createdAt && data.createdAt.toDate) {
                        const dateObj = data.createdAt.toDate();
                        dateStr = dateObj.toLocaleDateString('vi-VN') + " " + dateObj.toLocaleTimeString('vi-VN', {hour: '2-digit', minute:'2-digit'});
                    }

                    repliesCountDisplay.textContent = data.repliesCount || 0;
                    const imageDisplay = data.imageUrl ? `<img src="${data.imageUrl}" class="attached-image" alt="Ảnh đính kèm">` : ``;

                    // Kiểm tra UID để hiện nút Xóa Bài Viết
                    const deleteBtnHtml = (data.authorUid === currentUserUid) 
                        ? `<span>•</span> <button id="btn-delete-question" class="btn-delete-action">Xóa bài</button>` 
                        : ``;

                    questionContainer.innerHTML = `
                        <h1 class="question-title">${data.title}</h1>
                        <div class="post-meta">
                            <span style="display:flex; align-items:center;">Tác giả: <strong style="color: var(--text-main); margin-left: 4px;">${data.author}</strong></span>
                            <span>•</span>
                            <span>${dateStr}</span>${deleteBtnHtml}
                        </div>
                        <div class="question-content">${data.content}</div>${imageDisplay}
                    `;
                } else {
                    questionContainer.innerHTML = '<h3 style="color:var(--danger); text-align:center;">Bài viết không tồn tại hoặc đã bị xóa.</h3>';
                }
            } catch (error) {
                console.error("Lỗi tải câu hỏi:", error);
            }
        }

        // Sự kiện: Bấm nút xóa bài viết gốc
        questionContainer.addEventListener('click', async (e) => {
            if (e.target.id === 'btn-delete-question') {
                if(confirm("Bạn có chắc chắn muốn xóa bài viết này không? Toàn bộ trả lời bên trong cũng sẽ bị ẩn.")) {
                    try {
                        await deleteDoc(doc(db, "hoi_dap", questionId));
                        alert("Xóa bài viết thành công!");
                        window.location.href = "hoi_dap.html";
                    } catch (error) {
                        console.error("Lỗi xóa bài:", error);
                        alert("Có lỗi xảy ra khi xóa bài.");
                    }
                }
            }
        });

        function buildReplyHTML(reply, isSub, targetUser = '', topLevelId = '', parentContent = '', parentReplyId = '') {
            let dateStr = "Vừa xong";
            if (reply.createdAt && reply.createdAt.toDate) {
                const dateObj = reply.createdAt.toDate();
                dateStr = dateObj.toLocaleDateString('vi-VN') + " " + dateObj.toLocaleTimeString('vi-VN', {hour: '2-digit', minute:'2-digit'});
            }
            
            let cleanContent = reply.content.replace(/"/g, '&quot;').replace(/\n/g, ' ');
            let mySnippet = cleanContent.length > 80 ? cleanContent.substring(0, 80) + "..." : cleanContent;

            let referenceHtml = '';
            if (isSub) {
                let targetSnippet = reply.targetSnippet || parentContent;
                if(targetSnippet.length > 80) targetSnippet = targetSnippet.substring(0, 80) + "...";
                
                const scrollScript = `let el = document.getElementById('reply-${parentReplyId}'); if(el){ el.scrollIntoView({behavior: 'smooth', block: 'center'}); el.style.backgroundColor = '#EFF6FF'; setTimeout(()=>el.style.backgroundColor='', 1500); }`;

                referenceHtml = `
                    <div class="reply-reference" onclick="${scrollScript}" title="Nhấp để cuộn đến câu gốc">
                        <strong>↳ Đang trả lời @${targetUser}:</strong> <i>"${targetSnippet}"</i>
                    </div>
                `;
            }

            // Nút xóa chỉ hiện nếu uid trùng với tác giả của bình luận
            const deleteHtml = (reply.authorUid === currentUserUid) 
                ? `<button class="btn-reply-delete" data-replyid="${reply.id}">Xóa</button>` 
                : ``;

            const cardClass = isSub ? "reply-card sub-reply-card" : "reply-card";

            return `
                <div class="${cardClass}" id="reply-${reply.id}">
                    <div class="reply-meta">
                        <span class="reply-author">${reply.author}</span>
                        <span style="color: var(--text-muted);">${dateStr}</span>
                    </div>
                    ${referenceHtml}
                    <div class="reply-content">${reply.content}</div>
                    
                    <div class="reply-actions-row">
                        <button class="btn-reply-action" data-toplevel="${isSub ? topLevelId : reply.id}" data-targetid="${reply.id}" data-author="${reply.author}" data-snippet="${mySnippet}">Phản hồi</button>
                        ${deleteHtml}
                    </div>
                </div>
            `;
        }

        async function loadRepliesData() {
            try {
                const q = query(collection(db, "hoi_dap", questionId, "replies"), orderBy("createdAt", "asc"));
                const querySnapshot = await getDocs(q);
                
                if (querySnapshot.empty) {
                    repliesList.innerHTML = '<p style="text-align:center; color:var(--text-muted); padding: 20px; font-size:14px;">Chưa có câu trả lời nào. Hãy là người đầu tiên trả lời nhé!</p>';
                    return;
                }

                let topLevel = [];
                let children = {}; 

                querySnapshot.forEach((docSnap) => {
                    const reply = { id: docSnap.id, ...docSnap.data() };
                    if (reply.replyToId) { 
                        if (!children[reply.replyToId]) children[reply.replyToId] = [];
                        children[reply.replyToId].push(reply);
                    } else { 
                        topLevel.push(reply);
                    }
                });

                let html = '';
                topLevel.forEach(parent => {
                    let parentSnippetStr = parent.content.replace(/"/g, '&quot;').replace(/\n/g, ' ');

                    html += buildReplyHTML(parent, false, '', parent.id, parentSnippetStr, '');
                    
                    if (children[parent.id]) {
                        children[parent.id].forEach(child => {
                            let target = child.replyToUser || parent.author;
                            let targetId = child.targetReplyId || parent.id; 
                            html += buildReplyHTML(child, true, target, parent.id, parentSnippetStr, targetId);
                        });
                    }
                    html += `<div id="sub-reply-container-${parent.id}"></div>`;
                });
                
                repliesList.innerHTML = html;

            } catch (error) {
                console.error("Lỗi tải dữ liệu trả lời:", error);
            }
        }

        // ========================================================
        // SỰ KIỆN DELEGATION TRONG KHU VỰC CÂU TRẢ LỜI
        // ========================================================
        repliesList.addEventListener('click', async (e) => {
            
            // 1. Nút Mở Form Phản hồi
            if (e.target.classList.contains('btn-reply-action')) {
                const topLevelId = e.target.getAttribute('data-toplevel');
                const targetAuthor = e.target.getAttribute('data-author');
                const targetId = e.target.getAttribute('data-targetid');
                const targetSnippet = e.target.getAttribute('data-snippet');
                
                const existingForm = document.getElementById('temp-sub-reply-form');
                if (existingForm) existingForm.remove();

                const formHtml = `
                    <div id="temp-sub-reply-form" class="reply-form-container" style="margin-top: 0; margin-bottom: 10px; padding: 12px;">
                        <textarea id="sub-reply-input" class="reply-textarea" placeholder="Phản hồi @${targetAuthor}..." style="height: 60px; margin-bottom: 8px;"></textarea>
                        <div style="display: flex; gap: 8px;">
                            <button class="btn-primary btn-submit-sub-reply" data-toplevel="${topLevelId}" data-targetuser="${targetAuthor}" data-targetid="${targetId}" data-snippet="${targetSnippet}" style="width: auto; padding: 6px 12px; font-size: 12px;">Gửi phản hồi</button>
                            <button class="btn-cancel-sub-reply" style="padding: 6px 12px; font-size: 12px; border: 1px solid var(--border-color); border-radius: 6px; background: white; cursor: pointer; color: var(--text-main);">Hủy</button>
                        </div>
                    </div>
                `;
                document.getElementById(`sub-reply-container-${topLevelId}`).innerHTML = formHtml;
                document.getElementById('sub-reply-input').focus();
            }

            // 2. Nút Hủy phản hồi
            if (e.target.classList.contains('btn-cancel-sub-reply')) {
                document.getElementById('temp-sub-reply-form').remove();
            }

            // 3. Nút Xóa Câu Trả Lời
            if (e.target.classList.contains('btn-reply-delete')) {
                if(confirm("Bạn có chắc chắn muốn xóa câu trả lời này?")) {
                    const replyId = e.target.getAttribute('data-replyid');
                    try {
                        await deleteDoc(doc(db, "hoi_dap", questionId, "replies", replyId));
                        
                        // Cập nhật lại biến đếm
                        await updateDoc(doc(db, "hoi_dap", questionId), { repliesCount: increment(-1) });
                        repliesCountDisplay.textContent = Math.max(0, parseInt(repliesCountDisplay.textContent) - 1);
                        
                        loadRepliesData(); // Reload
                    } catch(err) {
                        console.error("Lỗi xóa trả lời:", err);
                        alert("Không thể xóa lúc này.");
                    }
                }
            }

            // 4. Gửi Phản hồi
            if (e.target.classList.contains('btn-submit-sub-reply')) {
                if (!currentAuthorName) {
                    alert("Vui lòng cập nhật 'Tên hiển thị' trong mục Thông tin cá nhân trước khi trả lời!");
                    window.location.href = "thong_tin_ca_nhan.html";
                    return;
                }

                const topLevelId = e.target.getAttribute('data-toplevel');
                const targetUser = e.target.getAttribute('data-targetuser');
                const targetId = e.target.getAttribute('data-targetid');
                const targetSnippet = e.target.getAttribute('data-snippet');
                const inputEl = document.getElementById('sub-reply-input');
                const contentVal = inputEl.value.trim();
                
                if (!contentVal) return alert("Vui lòng nhập nội dung.");

                e.target.textContent = "Đang gửi...";
                e.target.disabled = true;

                try {
                    await addDoc(collection(db, "hoi_dap", questionId, "replies"), {
                        content: contentVal,
                        author: currentAuthorName,
                        authorUid: auth.currentUser.uid,
                        replyToId: topLevelId,       
                        replyToUser: targetUser,     
                        targetReplyId: targetId,     
                        targetSnippet: targetSnippet, 
                        createdAt: serverTimestamp()
                    });

                    await updateDoc(doc(db, "hoi_dap", questionId), { repliesCount: increment(1) });
                    repliesCountDisplay.textContent = parseInt(repliesCountDisplay.textContent) + 1;
                    
                    loadRepliesData();
                } catch (error) {
                    console.error("Lỗi gửi phản hồi:", error);
                    alert("Có lỗi xảy ra.");
                }
            }
        });

        // ========================================================
        // GỬI CÂU TRẢ LỜI GỐC (DƯỚI CÙNG TRANG)
        // ========================================================
        btnSubmitReply.addEventListener('click', async () => {
            if (!currentAuthorName) {
                alert("Vui lòng cập nhật 'Tên hiển thị' trong mục Thông tin cá nhân trước khi trả lời!");
                window.location.href = "thong_tin_ca_nhan.html";
                return;
            }

            const contentVal = replyInput.value.trim();
            if (!contentVal) {
                alert("Vui lòng nhập nội dung.");
                return;
            }

            btnSubmitReply.textContent = "Đang gửi...";
            btnSubmitReply.disabled = true;

            try {
                await addDoc(collection(db, "hoi_dap", questionId, "replies"), {
                    content: contentVal,
                    author: currentAuthorName,
                    authorUid: auth.currentUser.uid,
                    createdAt: serverTimestamp()
                });

                await updateDoc(doc(db, "hoi_dap", questionId), { repliesCount: increment(1) });
                repliesCountDisplay.textContent = parseInt(repliesCountDisplay.textContent) + 1;
                
                replyInput.value = '';
                btnSubmitReply.textContent = "Gửi trả lời";
                btnSubmitReply.disabled = false;
                
                loadRepliesData();

            } catch (error) {
                console.error("Lỗi gửi trả lời:", error);
                alert("Có lỗi xảy ra, vui lòng thử lại.");
                btnSubmitReply.textContent = "Gửi trả lời";
                btnSubmitReply.disabled = false;
            }
        });
    </script>
</body>
</html>
