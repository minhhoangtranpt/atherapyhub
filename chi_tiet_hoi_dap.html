<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chi tiết Hỏi & Đáp - ATherapyHub</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* Khung hiển thị câu hỏi gốc */
        .question-box {
            background-color: var(--bg-card);
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.03);
            margin-bottom: 40px;
            border: 1px solid var(--border-color);
        }

        .question-title {
            font-size: 22px;
            color: var(--navy-primary);
            margin-bottom: 15px;
            line-height: 1.4;
        }

        .post-meta {
            font-size: 13px;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 20px;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--border-color);
        }

        .question-content {
            font-size: 16px;
            line-height: 1.7;
            text-align: justify;
            white-space: pre-wrap; 
        }

        /* Khu vực Bình luận / Câu trả lời */
        .replies-section-title {
            font-size: 18px;
            color: var(--navy-secondary);
            margin-bottom: 20px;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 10px;
            font-weight: 600;
        }

        .reply-card {
            background-color: white;
            padding: 20px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            margin-bottom: 15px;
        }

        /* Thiết kế cho Câu Phản hồi (Sub-reply) */
        .sub-reply-card {
            margin-left: 40px;
            background-color: #F8FAFC;
            border-left: 3px solid var(--accent-blue);
            padding: 15px 20px;
        }

        .reply-meta {
            display: flex;
            justify-content: space-between;
            margin-bottom: 12px;
            font-size: 13px;
        }

        .reply-author {
            font-weight: 600;
            color: var(--navy-primary);
        }

        .reply-content {
            font-size: 15px;
            line-height: 1.6;
            white-space: pre-wrap;
        }

        /* Nút Phản hồi nhỏ dưới mỗi comment */
        .btn-reply-action {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            padding: 0;
            margin-top: 10px;
            transition: color 0.2s;
        }

        .btn-reply-action:hover {
            color: var(--navy-primary);
            text-decoration: underline;
        }

        /* Form trả lời gốc */
        .reply-form-container {
            margin-top: 30px;
            background-color: var(--navy-light);
            padding: 24px;
            border-radius: 12px;
            border: 1px solid #BFDBFE;
        }

        .reply-textarea {
            width: 100%;
            height: 120px;
            padding: 15px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            resize: vertical;
            font-family: inherit;
            font-size: 14px;
            margin-bottom: 15px;
        }

        .reply-textarea:focus {
            outline: none;
            border-color: var(--navy-secondary);
        }

        /* Nút quay lại */
        .btn-back {
            display: inline-block;
            margin-bottom: 20px;
            color: var(--text-muted);
            text-decoration: none;
            font-weight: 500;
            font-size: 14px;
        }

        .btn-back:hover {
            color: var(--navy-primary);
        }

        @media (max-width: 768px) {
            .question-box {
                padding: 20px;
            }
            .sub-reply-card {
                margin-left: 20px; 
            }
        }
    </style>
</head>
<body>

    <main id="main-content">
        
        <a href="hoi_dap.html" class="btn-back">← Quay lại danh sách Hỏi & Đáp</a>

        <!-- Cảnh báo chưa đăng nhập -->
        <div id="auth-warning" style="display: none; text-align: center; padding: 60px 20px; background: white; border-radius: 12px; border: 1px solid var(--border-color);">
            <h3 style="color: var(--danger); margin-bottom: 10px;">Yêu cầu Đăng nhập</h3>
            <p style="color: var(--text-muted); margin-bottom: 20px;">Bạn cần đăng nhập để xem chi tiết và thảo luận trong bài viết này.</p>
            <button class="btn-primary" style="max-width: 250px;" onclick="document.getElementById('login-modal').style.display='flex'">Đăng nhập ngay</button>
        </div>

        <!-- Nội dung chính -->
        <div id="qa-content-wrapper" style="display: none;">
            
            <div id="question-container" class="question-box">
                <div style="text-align: center; color: var(--text-muted);">Đang tải nội dung câu hỏi...</div>
            </div>

            <div id="replies-section">
                <div class="replies-section-title">
                    Câu trả lời (<span id="replies-count">0</span>)
                </div>
                
                <!-- Nơi chứa tất cả bình luận và bình luận con -->
                <div id="replies-list"></div>

                <!-- Khung nhập câu trả lời TỔNG QUÁT -->
                <div class="reply-form-container">
                    <h4 style="margin-top: 0; margin-bottom: 15px; color: var(--navy-primary);">Viết câu trả lời của bạn</h4>
                    <textarea id="reply-input" class="reply-textarea" placeholder="Chia sẻ kiến thức hoặc kinh nghiệm của bạn..."></textarea>
                    <button id="btn-submit-reply" class="btn-primary" style="width: auto; padding: 10px 25px;">Gửi bình luận</button>
                </div>
            </div>

        </div>

    </main>

    <!-- Nạp Layout Header/Footer -->
    <script type="module" src="layout.js"></script>

    <!-- Script Firebase -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { 
            getFirestore, doc, getDoc, collection, addDoc, getDocs, 
            query, orderBy, serverTimestamp, updateDoc, increment
        } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBcC-sXCRnZ1eg9gzGR25HvaNi-B1P3Xuo",
            authDomain: "datatherapy-52437.firebaseapp.com",
            projectId: "datatherapy-52437",
            storageBucket: "datatherapy-52437.firebasestorage.app",
            messagingSenderId: "206559916642",
            appId: "1:206559916642:web:d4e911752ef2bb3b58973b"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        const urlParams = new URLSearchParams(window.location.search);
        const questionId = urlParams.get('id');

        const authWarning = document.getElementById('auth-warning');
        const qaContentWrapper = document.getElementById('qa-content-wrapper');
        const questionContainer = document.getElementById('question-container');
        const repliesList = document.getElementById('replies-list');
        const repliesCountDisplay = document.getElementById('replies-count');
        const btnSubmitReply = document.getElementById('btn-submit-reply');
        const replyInput = document.getElementById('reply-input');

        onAuthStateChanged(auth, (user) => {
            if (!user) {
                authWarning.style.display = 'block';
                qaContentWrapper.style.display = 'none';
            } else {
                authWarning.style.display = 'none';
                qaContentWrapper.style.display = 'block';
                if (questionId) {
                    loadQuestionData();
                    loadRepliesData();
                } else {
                    questionContainer.innerHTML = '<h3 style="color:var(--danger); text-align:center;">Lỗi: Không tìm thấy ID bài viết.</h3>';
                }
            }
        });

        async function loadQuestionData() {
            try {
                const docRef = doc(db, "hoi_dap", questionId);
                const docSnap = await getDoc(docRef);

                if (docSnap.exists()) {
                    const data = docSnap.data();
                    let dateStr = "";
                    if (data.createdAt && data.createdAt.toDate) {
                        const dateObj = data.createdAt.toDate();
                        dateStr = dateObj.toLocaleDateString('vi-VN') + " " + dateObj.toLocaleTimeString('vi-VN', {hour: '2-digit', minute:'2-digit'});
                    }

                    repliesCountDisplay.textContent = data.repliesCount || 0;

                    questionContainer.innerHTML = `
                        <h1 class="question-title">${data.title}</h1>
                        <div class="post-meta">
                            <span>Tác giả: <strong style="color: var(--text-main);">${data.author}</strong></span>
                            <span>•</span>
                            <span>Ngày đăng: ${dateStr}</span>
                        </div>
                        <div class="question-content">${data.content}</div>
                    `;
                } else {
                    questionContainer.innerHTML = '<h3 style="color:var(--danger); text-align:center;">Bài viết không tồn tại hoặc đã bị xóa.</h3>';
                }
            } catch (error) {
                console.error("Lỗi tải câu hỏi:", error);
            }
        }

        // HÀM XÂY DỰNG GIAO DIỆN MỘT BÌNH LUẬN
        function buildReplyHTML(reply, isSub, targetUser = '', topLevelId = '') {
            let dateStr = "Vừa xong";
            if (reply.createdAt && reply.createdAt.toDate) {
                const dateObj = reply.createdAt.toDate();
                dateStr = dateObj.toLocaleDateString('vi-VN') + " " + dateObj.toLocaleTimeString('vi-VN', {hour: '2-digit', minute:'2-digit'});
            }
            
            if (isSub) {
                // Thẻ Phản hồi con (có thêm tag tên người dùng)
                return `
                    <div class="reply-card sub-reply-card">
                        <div class="reply-meta">
                            <span class="reply-author">${reply.author}</span>
                            <span style="color: var(--text-muted);">${dateStr}</span>
                        </div>
                        <div class="reply-content">
                            <span style="color:var(--accent-blue); font-weight:600;">@${targetUser}</span> 
                            ${reply.content}
                        </div>
                        <button class="btn-reply-action" data-toplevel="${topLevelId}" data-author="${reply.author}">Phản hồi</button>
                    </div>
                `;
            } else {
                // Thẻ Bình luận gốc
                return `
                    <div class="reply-card">
                        <div class="reply-meta">
                            <span class="reply-author">${reply.author}</span>
                            <span style="color: var(--text-muted);">${dateStr}</span>
                        </div>
                        <div class="reply-content">${reply.content}</div>
                        <button class="btn-reply-action" data-toplevel="${reply.id}" data-author="${reply.author}">Phản hồi</button>
                    </div>
                `;
            }
        }

        async function loadRepliesData() {
            try {
                const q = query(collection(db, "hoi_dap", questionId, "replies"), orderBy("createdAt", "asc"));
                const querySnapshot = await getDocs(q);
                
                if (querySnapshot.empty) {
                    repliesList.innerHTML = '<p style="text-align:center; color:var(--text-muted); padding: 20px;">Chưa có câu trả lời nào. Hãy là người đầu tiên giúp đỡ đồng nghiệp nhé!</p>';
                    return;
                }

                // Tách riêng Bình luận gốc (topLevel) và Phản hồi (children)
                let topLevel = [];
                let children = {}; 

                querySnapshot.forEach((docSnap) => {
                    const reply = { id: docSnap.id, ...docSnap.data() };
                    if (reply.replyToId) { // Là phản hồi con
                        if (!children[reply.replyToId]) children[reply.replyToId] = [];
                        children[reply.replyToId].push(reply);
                    } else { // Bình luận gốc
                        topLevel.push(reply);
                    }
                });

                // Lắp ráp HTML
                let html = '';
                topLevel.forEach(parent => {
                    html += buildReplyHTML(parent, false, '', parent.id);
                    
                    // Render tất cả các phản hồi bên trong Parent này
                    if (children[parent.id]) {
                        children[parent.id].forEach(child => {
                            // Nếu child có targetUser thì tag người đó, nếu không mặc định tag Parent
                            let target = child.replyToUser || parent.author;
                            html += buildReplyHTML(child, true, target, parent.id);
                        });
                    }
                    
                    // Thẻ div chứa Form trả lời tạm thời
                    html += `<div id="sub-reply-container-${parent.id}"></div>`;
                });
                
                repliesList.innerHTML = html;

            } catch (error) {
                console.error("Lỗi tải bình luận:", error);
            }
        }

        // ========================================================
        // SỰ KIỆN KHI BẤM NÚT "PHẢN HỒI" TRONG DANH SÁCH
        // ========================================================
        repliesList.addEventListener('click', async (e) => {
            
            // 1. Mở form Phản hồi ngay dưới bình luận gốc
            if (e.target.classList.contains('btn-reply-action')) {
                const topLevelId = e.target.getAttribute('data-toplevel');
                const targetAuthor = e.target.getAttribute('data-author');
                
                const existingForm = document.getElementById('temp-sub-reply-form');
                if (existingForm) existingForm.remove();

                const formHtml = `
                    <div id="temp-sub-reply-form" class="reply-form-container" style="margin-left: 40px; margin-top: 0; margin-bottom: 15px; padding: 15px;">
                        <textarea id="sub-reply-input" class="reply-textarea" placeholder="Phản hồi @${targetAuthor}..." style="height: 80px; margin-bottom: 10px;"></textarea>
                        <div style="display: flex; gap: 10px;">
                            <button class="btn-primary btn-submit-sub-reply" data-toplevel="${topLevelId}" data-targetuser="${targetAuthor}" style="width: auto; padding: 6px 15px; font-size: 13px;">Gửi phản hồi</button>
                            <button class="btn-cancel-sub-reply" style="padding: 6px 15px; font-size: 13px; border: 1px solid var(--border-color); border-radius: 8px; background: white; cursor: pointer; color: var(--text-main);">Hủy</button>
                        </div>
                    </div>
                `;
                document.getElementById(`sub-reply-container-${topLevelId}`).innerHTML = formHtml;
                document.getElementById('sub-reply-input').focus();
            }

            // 2. Nút Hủy phản hồi
            if (e.target.classList.contains('btn-cancel-sub-reply')) {
                document.getElementById('temp-sub-reply-form').remove();
            }

            // 3. Nút Gửi phản hồi (Sub-reply)
            if (e.target.classList.contains('btn-submit-sub-reply')) {
                const topLevelId = e.target.getAttribute('data-toplevel');
                const targetUser = e.target.getAttribute('data-targetuser');
                const inputEl = document.getElementById('sub-reply-input');
                const contentVal = inputEl.value.trim();
                
                if (!contentVal) return alert("Vui lòng nhập nội dung.");

                e.target.textContent = "Đang gửi...";
                e.target.disabled = true;

                try {
                    const authorName = auth.currentUser.email;
                    
                    // Lưu lên Firestore
                    await addDoc(collection(db, "hoi_dap", questionId, "replies"), {
                        content: contentVal,
                        author: authorName,
                        replyToId: topLevelId,       // Gom nhóm vào top-level
                        replyToUser: targetUser,     // Dùng để render @tag
                        createdAt: serverTimestamp()
                    });

                    await updateDoc(doc(db, "hoi_dap", questionId), { repliesCount: increment(1) });
                    repliesCountDisplay.textContent = parseInt(repliesCountDisplay.textContent) + 1;
                    
                    loadRepliesData(); // Reload toàn bộ bình luận
                } catch (error) {
                    console.error("Lỗi gửi phản hồi:", error);
                    alert("Có lỗi xảy ra.");
                }
            }
        });

        // ========================================================
        // GỬI BÌNH LUẬN GỐC (DƯỚI CÙNG TRANG)
        // ========================================================
        btnSubmitReply.addEventListener('click', async () => {
            const contentVal = replyInput.value.trim();
            if (!contentVal) {
                alert("Vui lòng nhập nội dung.");
                return;
            }

            btnSubmitReply.textContent = "Đang gửi...";
            btnSubmitReply.disabled = true;

            try {
                const authorName = auth.currentUser.email;

                await addDoc(collection(db, "hoi_dap", questionId, "replies"), {
                    content: contentVal,
                    author: authorName,
                    createdAt: serverTimestamp()
                });

                await updateDoc(doc(db, "hoi_dap", questionId), { repliesCount: increment(1) });
                repliesCountDisplay.textContent = parseInt(repliesCountDisplay.textContent) + 1;
                
                replyInput.value = '';
                btnSubmitReply.textContent = "Gửi bình luận";
                btnSubmitReply.disabled = false;
                
                loadRepliesData();

            } catch (error) {
                console.error("Lỗi gửi bình luận gốc:", error);
                alert("Có lỗi xảy ra, vui lòng thử lại.");
                btnSubmitReply.textContent = "Gửi bình luận";
                btnSubmitReply.disabled = false;
            }
        });
    </script>
</body>
</html>
