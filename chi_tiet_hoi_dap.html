<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chi tiết Hỏi & Đáp - ATherapyHub</title>
    <!-- Nhúng CSS dùng chung -->
    <link rel="stylesheet" href="style.css">
    <style>
        /* CSS riêng cho trang Chi Tiết */
        
        /* Khung hiển thị câu hỏi gốc */
        .question-box {
            background-color: var(--bg-card);
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.03);
            margin-bottom: 40px;
            border: 1px solid var(--border-color);
        }

        .question-title {
            font-size: 22px;
            color: var(--navy-primary);
            margin-bottom: 15px;
            line-height: 1.4;
        }

        .post-meta {
            font-size: 13px;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 20px;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--border-color);
        }

        .question-content {
            font-size: 16px;
            line-height: 1.7;
            text-align: justify;
        }

        /* Khu vực Bình luận / Câu trả lời */
        .replies-section-title {
            font-size: 18px;
            color: var(--navy-secondary);
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .reply-card {
            background-color: white;
            padding: 20px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            margin-bottom: 15px;
        }

        .reply-meta {
            display: flex;
            justify-content: space-between;
            margin-bottom: 12px;
            font-size: 13px;
        }

        .reply-author {
            font-weight: 600;
            color: var(--navy-primary);
        }

        .reply-content {
            font-size: 15px;
            line-height: 1.6;
        }

        /* Nút quay lại */
        .btn-back {
            display: inline-block;
            margin-bottom: 20px;
            color: var(--text-muted);
            text-decoration: none;
            font-weight: 500;
            font-size: 14px;
        }

        .btn-back:hover {
            color: var(--navy-primary);
        }

        @media (max-width: 768px) {
            .question-box {
                padding: 20px;
            }
        }
    </style>
</head>
<body>

    <main id="main-content">
        
        <a href="hoi_dap.html" class="btn-back">← Quay lại danh sách Hỏi & Đáp</a>

        <!-- Khung hiển thị câu hỏi (Sẽ được JS ghi đè dữ liệu vào) -->
        <div id="question-container" class="question-box">
            <div style="text-align: center; color: var(--text-muted);">Đang tải nội dung câu hỏi...</div>
        </div>

        <!-- Khung hiển thị các câu trả lời -->
        <div id="replies-section" style="display: none;">
            <div class="replies-section-title">
                <span>Câu trả lời (<span id="replies-count">0</span>)</span>
                <button class="btn-login-nav" style="box-shadow:none;" onclick="alert('Tính năng bình luận đang phát triển!')">Viết trả lời</button>
            </div>
            
            <div id="replies-list">
                <!-- Các bình luận sẽ được JS chèn vào đây -->
            </div>
        </div>

    </main>

    <!-- Nhúng JS dạng module để tự động gắn Header/Footer -->
    <script type="module" src="layout.js"></script>

    <!-- Script xử lý hiển thị chi tiết câu hỏi -->
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            // 1. Lấy ID bài viết từ thanh URL (Ví dụ: chi_tiet_hoi_dap.html?id=qa123)
            const urlParams = new URLSearchParams(window.location.search);
            const questionId = urlParams.get('id');

            const questionContainer = document.getElementById('question-container');
            const repliesSection = document.getElementById('replies-section');
            const repliesList = document.getElementById('replies-list');
            const repliesCountDisplay = document.getElementById('replies-count');

            if (!questionId) {
                questionContainer.innerHTML = '<h3 style="color:var(--danger); text-align:center;">Lỗi: Không tìm thấy bài viết.</h3>';
                return;
            }

            // 2. MẢNG DỮ LIỆU GIẢ LẬP (MOCK DATA)
            // (Trong thực tế bạn sẽ fetch từ Firebase db dựa trên questionId)
            const mockDatabase = {
                "qa123": {
                    title: "Hỏi về phác đồ tập phục hồi chức năng sau mổ tái tạo dây chằng chéo trước (ACL) tuần thứ 4?",
                    author: "Trần Minh Hoàng",
                    date: "16/10/2026 14:30",
                    content: "Chào các anh chị đồng nghiệp. Em đang có một bệnh nhân nam 25 tuổi, tiền sử đứt bán phần ACL do đá bóng. Bệnh nhân đã được phẫu thuật tái tạo bằng gân bánh chè (BTB). Hiện tại bệnh nhân đang ở tuần thứ 4 sau phẫu thuật.<br><br>ROM khớp gối hiện tại: Gập 90 độ, duỗi 0 độ (hơi khó khăn khi duỗi chủ động hoàn toàn). Bệnh nhân đã bỏ nạng đi lại nhẹ nhàng nhưng dáng đi vẫn còn khập khiễng.<br><br>Xin hỏi các anh chị giai đoạn này nên tập trung vào các bài tập nào để cải thiện sức mạnh cơ tứ đầu mà không làm giãn mảnh ghép? Có nên cho đạp xe đạp lực cản nhẹ chưa ạ? Em xin cảm ơn.",
                    replies: [
                        {
                            author: "BS. Nguyễn Thành Nam",
                            date: "16/10/2026 16:45",
                            content: "Ở tuần thứ 4 với mảnh ghép BTB thì mảnh ghép đang ở giai đoạn hoại tử vô mạch (Necrosis phase) và bắt đầu tái phân bổ mạch máu, nên mảnh ghép lúc này yếu nhất. Không nên cố ép ROM gập quá mạnh. Về cơ tứ đầu, em có thể cho tập SLR (Straight Leg Raise) nhưng phải mang nẹp duỗi thẳng, tập co cơ tĩnh (Isometric). Đạp xe không lực cản có thể bắt đầu để duy trì biên độ khớp."
                        },
                        {
                            author: "PT. Lê Mai Hương",
                            date: "16/10/2026 20:10",
                            content: "Đồng ý với bác Nam. Chú ý dáng đi khập khiễng có thể do bệnh nhân chưa lấy lại được độ duỗi hoàn toàn (Terminal extension) hoặc do ức chế cơ tứ đầu. Cần hướng dẫn tập lại dáng đi trước gương (Gait training) và tăng cường kiểm soát phần cơ mông."
                        }
                    ]
                },
                "qa124": {
                    title: "Bệnh nhân đột quỵ nhồi máu não sau 3 tháng, tay bị co cứng (Spasticity) độ 3 theo Ashworth. Xin lời khuyên can thiệp.",
                    author: "Nguyen Van A",
                    date: "15/10/2026 09:15",
                    content: "Như tiêu đề, bệnh nhân nam 60 tuổi bị co cứng mẫu gập tay P rất nặng. Em đã thử kéo giãn tĩnh và tập vận động thụ động nhưng cơ vẫn kháng lại rất mạnh. Bệnh nhân có chỉ định chích Botox nhưng gia đình chưa đồng ý vì lý do kinh tế. Có phương pháp nào hiệu quả để giảm co cứng tạm thời trước khi tập vận động không ạ?",
                    replies: []
                }
            };

            // 3. HÀM HIỂN THỊ DỮ LIỆU LÊN GIAO DIỆN
            function renderPostDetails() {
                const data = mockDatabase[questionId];

                if (!data) {
                    questionContainer.innerHTML = '<h3 style="color:var(--danger); text-align:center;">Bài viết này không tồn tại hoặc đã bị xóa.</h3>';
                    return;
                }

                // In câu hỏi
                questionContainer.innerHTML = `
                    <h1 class="question-title">${data.title}</h1>
                    <div class="post-meta">
                        <span>👤 Tác giả: <strong>${data.author}</strong></span>
                        <span>🕒 Ngày đăng: ${data.date}</span>
                    </div>
                    <div class="question-content">
                        ${data.content}
                    </div>
                `;

                // In danh sách câu trả lời
                repliesSection.style.display = 'block';
                repliesCountDisplay.textContent = data.replies.length;

                if (data.replies.length === 0) {
                    repliesList.innerHTML = '<p style="text-align:center; color:var(--text-muted); padding: 20px;">Chưa có câu trả lời nào. Hãy là người đầu tiên giúp đỡ đồng nghiệp nhé!</p>';
                } else {
                    let repliesHtml = '';
                    data.replies.forEach(reply => {
                        repliesHtml += `
                            <div class="reply-card">
                                <div class="reply-meta">
                                    <span class="reply-author">👤 ${reply.author}</span>
                                    <span style="color: var(--text-muted);">🕒 ${reply.date}</span>
                                </div>
                                <div class="reply-content">
                                    ${reply.content}
                                </div>
                            </div>
                        `;
                    });
                    repliesList.innerHTML = repliesHtml;
                }
            }

            // Giả lập thời gian lấy dữ liệu mạng
            setTimeout(() => {
                renderPostDetails();
            }, 400);
        });
    </script>
</body>
</html>
