<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - QHphysio</title>
    <style>
        /* CSS Giao diện tĩnh, sạch sẽ */
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 0; background-color: #f4f7f6; color: #333; }
        .navbar { background-color: #2c3e50; color: white; padding: 15px 30px; display: flex; justify-content: space-between; align-items: center; }
        .navbar h2 { margin: 0; font-size: 1.5em; letter-spacing: 1px; }
        
        .nav-links { display: flex; gap: 20px; align-items: center; }
        .nav-links span { font-size: 0.9em; color: #bdc3c7; }
        .nav-links a.admin-link { color: #f1c40f; text-decoration: none; font-size: 0.9em; font-weight: bold; display: none; }
        
        .btn-auth { background-color: #3498db; color: white; border: none; padding: 8px 15px; border-radius: 4px; cursor: pointer; font-weight: bold; transition: background-color 0.3s; }
        .btn-auth:hover { background-color: #2980b9; }
        .btn-auth.logout { background-color: #e74c3c; }
        .btn-auth.logout:hover { background-color: #c0392b; }
        
        .container { max-width: 1200px; margin: 30px auto; padding: 0 20px; display: grid; grid-template-columns: 300px 1fr; gap: 30px; }
        
        /* Cột Sidebar */
        .sidebar { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); height: fit-content; max-height: 80vh; overflow-y: auto; }
        .sidebar h3 { margin-top: 0; color: #34495e; border-bottom: 2px solid #ecf0f1; padding-bottom: 10px; }
        
        .category-list { list-style: none; padding: 0; margin: 0; }
        .category-list li { margin-bottom: 8px; }
        .category-list a { text-decoration: none; color: #555; display: block; padding: 10px; border-radius: 4px; transition: background-color 0.2s, color 0.2s; border-left: 3px solid transparent; }
        .category-list a:hover { background-color: #f1f2f6; }
        .category-list a.active { background-color: #e8f4f8; color: #2980b9; border-left: 3px solid #3498db; font-weight: 600; }
        
        /* Cột Nội dung chính */
        .main-content { background: white; padding: 40px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); min-height: 60vh; }
        .content-header { border-bottom: 1px solid #eee; padding-bottom: 15px; margin-bottom: 30px; }
        .content-header h1 { color: #2c3e50; margin: 0 0 10px 0; }
        .meta-data { color: #7f8c8d; font-size: 0.9em; }
        
        .document-text { line-height: 1.7; color: #2d3436; font-size: 1.05em; }
        .document-text table { width: 100%; border-collapse: collapse; margin: 20px 0; }
        .document-text th, .document-text td { border: 1px solid #bdc3c7; padding: 10px; text-align: left; }
        .document-text th { background-color: #f8f9fa; }
        
        .loading-text { text-align: center; color: #7f8c8d; font-style: italic; padding: 20px; }
    </style>
</head>
<body>

    <nav class="navbar">
        <h2>QHphysio</h2>
        <div class="nav-links">
            <span id="user-info">Khách viếng thăm</span>
            <a href="admin.html" class="admin-link" id="admin-link">Trang Quản Trị</a>
            <button class="btn-auth" id="auth-btn">Đăng nhập Admin</button>
        </div>
    </nav>

    <div class="container">
        <!-- Sidebar danh sách bài -->
        <aside class="sidebar">
            <h3>Danh mục tài liệu</h3>
            <ul class="category-list" id="document-list">
                <li class="loading-text">Đang tải dữ liệu...</li>
            </ul>
        </aside>

        <!-- Khung đọc bài viết -->
        <main class="main-content">
            <div id="content-viewer" style="display: none;">
                <div class="content-header">
                    <h1 id="doc-title">Tiêu đề bài viết</h1>
                    <div class="meta-data" id="doc-meta">Cập nhật: ... | Danh mục: ...</div>
                </div>
                <div class="document-text" id="doc-body"></div>
            </div>
            <div id="welcome-viewer" class="loading-text" style="margin-top: 50px;">
                Vui lòng chọn một tài liệu ở danh mục bên trái để đọc.
            </div>
        </main>
    </div>

    <!-- Script điều khiển -->
    <script type="module">
        import { auth, db, onAuthStateChanged, signOut, collection, getDocs } from './firebase-config.js';

        let articlesData = {}; 

        // 1. Tải bài viết ngay lập tức cho bất kỳ ai truy cập
        loadArticles(); 

        // 2. Kiểm tra phân quyền để hiển thị nút trên thanh điều hướng
        onAuthStateChanged(auth, (user) => {
            const authBtn = document.getElementById('auth-btn');
            const adminLink = document.getElementById('admin-link');
            const userInfo = document.getElementById('user-info');

            if (user) {
                // Giao diện khi Admin (bạn) đang đăng nhập
                userInfo.innerText = user.email;
                adminLink.style.display = 'inline'; 
                authBtn.innerText = "Đăng xuất";
                authBtn.classList.add('logout');
                authBtn.onclick = () => {
                    signOut(auth).then(() => window.location.reload());
                };
            } else {
                // Giao diện khi sinh viên / người dùng bình thường truy cập
                userInfo.innerText = "Khách viếng thăm";
                adminLink.style.display = 'none'; 
                authBtn.innerText = "Đăng nhập Admin";
                authBtn.classList.remove('logout');
                authBtn.onclick = () => {
                    window.location.href = 'index.html'; 
                };
            }
        });

        // 3. Hàm tải và sắp xếp dữ liệu
        async function loadArticles() {
            try {
                const querySnapshot = await getDocs(collection(db, "articles"));
                const listElement = document.getElementById('document-list');
                listElement.innerHTML = ''; 

                if (querySnapshot.empty) {
                    listElement.innerHTML = '<li class="loading-text">Chưa có tài liệu nào.</li>';
                    return;
                }

                // Chuyển dữ liệu vào mảng để sắp xếp thời gian (Mới nhất lên đầu)
                let articlesArray = [];
                querySnapshot.forEach((doc) => {
                    articlesArray.push({ id: doc.id, ...doc.data() });
                });

                articlesArray.sort((a, b) => {
                    let dateA = new Date(a.createdAt || 0);
                    let dateB = new Date(b.createdAt || 0);
                    return dateB - dateA; // Sắp xếp giảm dần
                });

                let isFirstArticle = true;

                // Render danh sách sau khi đã sắp xếp
                articlesArray.forEach((data) => {
                    articlesData[data.id] = data;

                    const li = document.createElement('li');
                    const a = document.createElement('a');
                    a.href = "#";
                    a.className = "doc-link";
                    a.id = `link-${data.id}`;
                    a.innerText = data.title;
                    
                    a.onclick = (e) => {
                        e.preventDefault();
                        window.showArticle(data.id);
                    };

                    li.appendChild(a);
                    listElement.appendChild(li);

                    // Tự động mở bài viết mới nhất
                    if (isFirstArticle) {
                        window.showArticle(data.id);
                        isFirstArticle = false;
                    }
                });
            } catch (error) {
                console.error("Lỗi khi tải dữ liệu: ", error);
                document.getElementById('document-list').innerHTML = '<li class="loading-text">Lỗi tải dữ liệu. Hãy kiểm tra Console (F12).</li>';
            }
        }

        // 4. Hàm hiển thị nội dung chi tiết
        window.showArticle = function(id) {
            const data = articlesData[id];
            if (!data) return;

            // Xử lý CSS hiển thị mục đang chọn
            document.querySelectorAll('.doc-link').forEach(el => el.classList.remove('active'));
            const activeLink = document.getElementById(`link-${id}`);
            if (activeLink) activeLink.classList.add('active');

            document.getElementById('welcome-viewer').style.display = 'none';
            document.getElementById('content-viewer').style.display = 'block';
            
            document.getElementById('doc-title').innerText = data.title;
            
            // Xử lý ngày tháng linh hoạt
            let dateString = "Không rõ";
            if (data.createdAt) {
                try {
                    if (typeof data.createdAt.toDate === 'function') {
                        dateString = data.createdAt.toDate().toLocaleDateString('vi-VN');
                    } else {
                        dateString = new Date(data.createdAt).toLocaleDateString('vi-VN');
                    }
                } catch(e) {}
            }

            // Dịch danh mục
            let categoryName = data.category;
            if (categoryName === 'ly-luan') categoryName = "Lý luận lâm sàng";
            if (categoryName === 'danh-gia') categoryName = "Thang điểm đánh giá";
            if (categoryName === 'phac-do') categoryName = "Phác đồ bài tập";

            document.getElementById('doc-meta').innerText = `Cập nhật: ${dateString} | Danh mục: ${categoryName}`;
            document.getElementById('doc-body').innerHTML = data.content;
        };
    </script>
</body>
</html>
