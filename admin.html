<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QH Physio Admin - Soạn thảo bài viết</title>
    <style>
        :root {
            --primary: #0284c7;
            --primary-hover: #0369a1;
            --bg-body: #f1f5f9;
            --bg-card: #ffffff;
            --text-main: #334155;
            --border-color: #cbd5e1;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            background-color: var(--bg-body);
            color: var(--text-main);
        }

        /* Admin Login Overlay */
        #admin-login-overlay {
            position: fixed; inset: 0; background: var(--bg-body);
            display: flex; justify-content: center; align-items: center; z-index: 1000;
        }
        .login-box {
            background: var(--bg-card); padding: 40px; border-radius: 12px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1); width: 100%; max-width: 360px;
            border: 1px solid var(--border-color);
        }
        .login-box h2 { color: var(--primary); margin-top: 0; text-align: center; }
        .input-box {
            width: 100%; padding: 12px; border: 1px solid var(--border-color);
            border-radius: 8px; margin-bottom: 15px; box-sizing: border-box; font-family: inherit; font-size: 15px;
        }
        .input-box:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.1); }
        .btn-action {
            width: 100%; background: var(--primary); color: white; border: none;
            padding: 12px; border-radius: 8px; font-weight: 600; cursor: pointer; font-size: 15px;
        }
        .btn-action:hover { background: var(--primary-hover); }

        /* Layout */
        #app-interface { display: none; height: 100vh; display: flex; flex-direction: column; }
        header {
            background: var(--bg-card); padding: 12px 24px; border-bottom: 1px solid var(--border-color);
            display: flex; justify-content: space-between; align-items: center; flex-shrink: 0;
        }
        .header-title { font-weight: 700; font-size: 18px; color: var(--text-main); }
        .header-actions { display: flex; align-items: center; gap: 15px; }
        
        #btn-publish { background: var(--primary); color: white; border: none; padding: 10px 20px; border-radius: 6px; font-weight: 600; cursor: pointer; }
        #btn-publish:disabled { opacity: 0.7; cursor: not-allowed; }
        #logout-btn { background: transparent; border: 1px solid var(--border-color); padding: 9px 15px; border-radius: 6px; cursor: pointer; font-weight: 600; }

        .workspace { display: flex; flex: 1; overflow: hidden; }
        
        /* Editor Area */
        .editor-canvas { flex: 1; padding: 30px; overflow-y: auto; display: flex; flex-direction: column; align-items: center; }
        .page-container {
            background: var(--bg-card); width: 100%; max-width: 800px;
            padding: 40px; border-radius: 12px; border: 1px solid var(--border-color);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
        }
        
        .title-input {
            width: 100%; border: none; font-size: 32px; font-weight: 700; outline: none;
            margin-bottom: 20px; font-family: inherit; color: var(--text-main);
        }
        .title-input::placeholder { color: #94a3b8; }
        
        .desc-input {
            width: 100%; border: none; font-size: 16px; outline: none; margin-bottom: 30px;
            color: #475569; resize: none; font-family: inherit; line-height: 1.5;
        }
        .content-input {
            width: 100%; min-height: 400px; border: none; font-size: 16px; outline: none;
            line-height: 1.7; resize: vertical; font-family: inherit; color: var(--text-main);
        }

        /* Sidebar Settings */
        .sidebar {
            width: 320px; background: var(--bg-card); border-left: 1px solid var(--border-color);
            padding: 24px; overflow-y: auto; flex-shrink: 0;
        }
        .sidebar-section { margin-bottom: 24px; }
        .sidebar-section label { display: block; font-size: 14px; font-weight: 600; margin-bottom: 8px; color: var(--text-main); }
        .hint-text { font-size: 12px; color: #64748b; margin-top: 4px; display: block; line-height: 1.4; }

        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div id="admin-login-overlay">
        <div class="login-box">
            <h2>Khu vực Quản trị</h2>
            <input type="email" id="admin-email" class="input-box" placeholder="Email Admin" required>
            <input type="password" id="admin-password" class="input-box" placeholder="Mật khẩu" required>
            <button id="btn-admin-login" class="btn-action">Đăng nhập</button>
            <div id="login-error" style="color: #ef4444; margin-top: 10px; font-size: 14px; text-align: center;"></div>
        </div>
    </div>

    <div id="app-interface" class="hidden">
        <header>
            <div class="header-title">Trình Tạo Phác Đồ & Bài Viết</div>
            <div class="header-actions">
                <span id="status-text" style="font-size: 14px; color: var(--text-main);">Đang soạn thảo</span>
                <button id="btn-publish">Xuất bản bài viết</button>
                <button id="logout-btn">Đăng xuất</button>
            </div>
        </header>

        <div class="workspace">
            <div class="editor-canvas">
                <div class="page-container">
                    <input type="text" id="post-title" class="title-input" placeholder="Tiêu đề bài viết...">
                    <textarea id="post-desc" class="desc-input" placeholder="Mô tả ngắn gọn (sẽ hiển thị ở trang chủ)..." rows="2"></textarea>
                    <textarea id="post-content" class="content-input" placeholder="Nhập nội dung bài viết chi tiết tại đây..."></textarea>
                </div>
            </div>

            <div class="sidebar">
                <div class="sidebar-section">
                    <label>Phân loại / Chuyên mục</label>
                    <input type="text" id="post-category" class="input-box" placeholder="VD: Thần kinh, Khớp gối...">
                    <span class="hint-text">Gõ tên chuyên mục để nhóm các bài viết liên quan.</span>
                </div>
                
                <div class="sidebar-section">
                    <label>Ảnh bìa (Thumbnail URL)</label>
                    <input type="text" id="post-image" class="input-box" placeholder="https://...">
                    <span class="hint-text">Dán đường dẫn ảnh mạng (URL) để làm hình đại diện.</span>
                </div>

                <div class="sidebar-section">
                    <label>File đính kèm (PDF URL)</label>
                    <input type="text" id="post-pdf" class="input-box" placeholder="https://...">
                    <span class="hint-text">Dán link Google Drive hoặc file PDF để Nhà trị liệu tải về.</span>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyA9X9Ot7qA88POY2JmsRaQuagvRq2M83Aw",
            authDomain: "qhphysio.firebaseapp.com",
            projectId: "qhphysio",
            storageBucket: "qhphysio.firebasestorage.app",
            messagingSenderId: "1074697284977",
            appId: "1:1074697284977:web:8f4d73f7fca0a2ea09dad0"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // THAY ĐỔI EMAIL QUẢN TRỊ VIÊN CỦA BẠN TẠI ĐÂY
        const ADMIN_EMAIL = "hoangtran1483@gmail.com";

        const overlay = document.getElementById('admin-login-overlay');
        const appInterface = document.getElementById('app-interface');
        const loginBtn = document.getElementById('btn-admin-login');
        const errorMsg = document.getElementById('login-error');
        const logoutBtn = document.getElementById('logout-btn');
        const publishBtn = document.getElementById('btn-publish');
        const statusText = document.getElementById('status-text');

        // Form Inputs
        const inTitle = document.getElementById('post-title');
        const inDesc = document.getElementById('post-desc');
        const inContent = document.getElementById('post-content');
        const inCategory = document.getElementById('post-category');
        const inImage = document.getElementById('post-image');
        const inPdf = document.getElementById('post-pdf');

        onAuthStateChanged(auth, (user) => {
            if (user) {
                if (user.email === ADMIN_EMAIL) {
                    overlay.classList.add('hidden');
                    appInterface.classList.remove('hidden');
                } else {
                    alert("Tài khoản của bạn không có quyền truy cập trang này!");
                    signOut(auth);
                }
            } else {
                overlay.classList.remove('hidden');
                appInterface.classList.add('hidden');
            }
        });

        loginBtn.addEventListener('click', () => {
            const email = document.getElementById('admin-email').value;
            const password = document.getElementById('admin-password').value;
            errorMsg.textContent = "Đang kiểm tra...";

            signInWithEmailAndPassword(auth, email, password)
                .catch(() => { errorMsg.textContent = "Sai thông tin đăng nhập!"; });
        });

        logoutBtn.addEventListener('click', () => signOut(auth));

        publishBtn.addEventListener('click', async () => {
            const title = inTitle.value.trim();
            const content = inContent.value.trim();

            if (!title) {
                alert("Bạn phải nhập Tiêu đề bài viết!");
                return;
            }

            publishBtn.disabled = true;
            publishBtn.textContent = "Đang lưu...";
            statusText.textContent = "Đang tải lên...";

            try {
                await addDoc(collection(db, "articles"), {
                    title: title,
                    description: inDesc.value.trim(),
                    content: content,
                    category: inCategory.value.trim(),
                    imageUrl: inImage.value.trim(),
                    pdfUrl: inPdf.value.trim(),
                    createdAt: serverTimestamp(),
                    authorEmail: auth.currentUser.email
                });

                statusText.textContent = "Đã xuất bản!";
                statusText.style.color = "#16a34a"; // Xanh thành công
                
                // Clear form
                inTitle.value = ""; inDesc.value = ""; inContent.value = "";
                inCategory.value = ""; inImage.value = ""; inPdf.value = "";

                setTimeout(() => {
                    statusText.textContent = "Đang soạn thảo";
                    statusText.style.color = "var(--text-main)";
                    publishBtn.disabled = false;
                    publishBtn.textContent = "Xuất bản bài viết";
                }, 2000);

            } catch (error) {
                alert("Lỗi: " + error.message);
                publishBtn.disabled = false;
                publishBtn.textContent = "Xuất bản bài viết";
            }
        });
    </script>
</body>
</html>
