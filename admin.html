<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QH Physio Admin - Soạn thảo bài viết</title>
    <!-- Tích hợp thư viện soạn thảo Quill.js -->
    <link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
    <style>
        :root {
            --primary: #0284c7; --primary-hover: #0369a1; --bg-body: #f1f5f9;
            --bg-card: #ffffff; --text-main: #334155; --border-color: #cbd5e1;
        }

        body { font-family: 'Inter', -apple-system, sans-serif; margin: 0; background-color: var(--bg-body); color: var(--text-main); }

        /* Admin Login Overlay */
        #admin-login-overlay { position: fixed; inset: 0; background: var(--bg-body); display: flex; justify-content: center; align-items: center; z-index: 1000; padding: 20px; }
        .login-box { background: var(--bg-card); padding: 40px 30px; border-radius: 12px; box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1); width: 100%; max-width: 360px; border: 1px solid var(--border-color); box-sizing: border-box; }
        .login-box h2 { color: var(--primary); margin-top: 0; text-align: center; }
        .input-box { width: 100%; padding: 12px; border: 1px solid var(--border-color); border-radius: 8px; margin-bottom: 15px; box-sizing: border-box; font-size: 15px; }
        .input-box:focus { outline: none; border-color: var(--primary); }
        .btn-action { width: 100%; background: var(--primary); color: white; border: none; padding: 12px; border-radius: 8px; font-weight: 600; cursor: pointer; font-size: 15px; }

        /* Layout */
        #app-interface { display: none; height: 100vh; display: flex; flex-direction: column; }
        header { background: var(--bg-card); padding: 12px 24px; border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; flex-shrink: 0; }
        .header-title { font-weight: 700; font-size: 18px; color: var(--text-main); }
        .header-actions { display: flex; align-items: center; gap: 10px; }
        .btn-link { text-decoration: none; color: var(--text-main); font-size: 14px; font-weight: 600; padding: 8px 12px; border-radius: 6px; background: #f1f5f9; }
        #btn-publish { background: var(--primary); color: white; border: none; padding: 8px 16px; border-radius: 6px; font-weight: 600; cursor: pointer; }
        #logout-btn { background: transparent; border: 1px solid var(--border-color); padding: 7px 12px; border-radius: 6px; cursor: pointer; font-weight: 600; }

        .workspace { display: flex; flex: 1; overflow: hidden; background: #f8fafc; }
        
        /* Editor Area */
        .editor-canvas { flex: 1; padding: 40px 20px; overflow-y: auto; display: flex; flex-direction: column; align-items: center; }
        .page-container { background: var(--bg-card); width: 100%; max-width: 800px; padding: 50px; border-radius: 12px; border: 1px solid var(--border-color); box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05); }
        
        .title-input { width: 100%; border: none; font-size: 32px; font-weight: 700; outline: none; margin-bottom: 15px; color: var(--text-main); }
        .desc-input { width: 100%; border: none; font-size: 16px; outline: none; margin-bottom: 20px; color: #475569; resize: none; border-bottom: 1px solid var(--border-color); padding-bottom: 20px; }
        
        /* Chỉnh CSS cho bộ soạn thảo Quill */
        .ql-toolbar { border: none !important; border-bottom: 1px solid var(--border-color) !important; padding: 10px 0 !important; margin-bottom: 20px; position: sticky; top: 0; background: white; z-index: 10; }
        .ql-container { border: none !important; font-size: 17px !important; font-family: inherit !important; min-height: 400px; }
        .ql-editor { padding: 0 !important; line-height: 1.8; }
        .ql-editor img { max-width: 100%; border-radius: 8px; margin: 10px 0; }

        .hidden { display: none !important; }

        /* TỐI ƯU GIAO DIỆN ĐIỆN THOẠI */
        @media (max-width: 768px) {
            header { flex-direction: column; align-items: flex-start; padding: 12px 15px; gap: 10px; }
            .header-actions { width: 100%; justify-content: space-between; }
            .workspace { background: var(--bg-card); }
            .editor-canvas { padding: 0; }
            .page-container { padding: 20px; border-radius: 0; border: none; box-shadow: none; }
            .title-input { font-size: 24px; }
            .desc-input { font-size: 15px; }
            #status-text { display: none; } /* Ẩn chữ đang soạn thảo cho gọn */
        }
    </style>
</head>
<body>

    <div id="admin-login-overlay">
        <div class="login-box">
            <h2>Quản trị viên</h2>
            <input type="email" id="admin-email" class="input-box" placeholder="Email Admin" required>
            <input type="password" id="admin-password" class="input-box" placeholder="Mật khẩu" required>
            <button id="btn-admin-login" class="btn-action">Đăng nhập</button>
            <div id="login-error" style="color: #ef4444; margin-top: 10px; font-size: 14px; text-align: center;"></div>
        </div>
    </div>

    <div id="app-interface" class="hidden">
        <header>
            <div class="header-title">Trình Tạo Bài Viết</div>
            <div class="header-actions">
                <a href="index.html" class="btn-link">← Hủy</a>
                <span id="status-text" style="font-size: 13px; color: var(--text-main);">Đang soạn thảo</span>
                <button id="btn-publish">Xuất bản</button>
                <button id="logout-btn">Thoát</button>
            </div>
        </header>

        <div class="workspace">
            <div class="editor-canvas">
                <div class="page-container">
                    <input type="text" id="post-title" class="title-input" placeholder="Tiêu đề bài viết...">
                    <textarea id="post-desc" class="desc-input" placeholder="Mô tả ngắn gọn..." rows="2"></textarea>
                    
                    <!-- Vùng soạn thảo Rich Text -->
                    <div id="editor-container"></div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.quilljs.com/1.3.6/quill.js"></script>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyA9X9Ot7qA88POY2JmsRaQuagvRq2M83Aw",
            authDomain: "qhphysio.firebaseapp.com",
            projectId: "qhphysio",
            storageBucket: "qhphysio.firebasestorage.app",
            messagingSenderId: "1074697284977",
            appId: "1:1074697284977:web:8f4d73f7fca0a2ea09dad0"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        const ADMIN_EMAIL = "hoangtran1483@gmail.com";

        // Khởi tạo Quill Editor (Thanh công cụ: chữ đậm, nghiêng, list, link, ảnh)
        var quill = new Quill('#editor-container', {
            theme: 'snow',
            placeholder: 'Nhập nội dung bài viết chi tiết tại đây',
            modules: {
                toolbar: [
                    [{ 'header': [2, 3, false] }],
                    ['bold', 'italic', 'underline'],
                    [{ 'list': 'ordered'}, { 'list': 'bullet' }],
                    ['link', 'image'], // Nút thêm hình ảnh
                    ['clean']
                ]
            }
        });

        const overlay = document.getElementById('admin-login-overlay');
        const appInterface = document.getElementById('app-interface');
        const loginBtn = document.getElementById('btn-admin-login');
        const publishBtn = document.getElementById('btn-publish');
        
        onAuthStateChanged(auth, (user) => {
            if (user && user.email === ADMIN_EMAIL) {
                overlay.classList.add('hidden');
                appInterface.classList.remove('hidden');
            } else if (user) {
                alert("Bạn không có quyền admin!"); window.location.href = "index.html";
            } else {
                overlay.classList.remove('hidden');
                appInterface.classList.add('hidden');
            }
        });

        loginBtn.addEventListener('click', () => {
            signInWithEmailAndPassword(auth, document.getElementById('admin-email').value, document.getElementById('admin-password').value)
                .catch(() => { document.getElementById('login-error').textContent = "Sai mật khẩu!"; });
        });

        document.getElementById('logout-btn').addEventListener('click', () => signOut(auth));

        publishBtn.addEventListener('click', async () => {
            const title = document.getElementById('post-title').value.trim();
            const desc = document.getElementById('post-desc').value.trim();
            // Lấy mã HTML chứa ảnh và định dạng từ bộ soạn thảo
            const contentHTML = quill.root.innerHTML;

            if (!title) { alert("Bạn phải nhập Tiêu đề bài viết!"); return; }

            publishBtn.disabled = true; publishBtn.textContent = "Đang lưu...";

            try {
                await addDoc(collection(db, "articles"), {
                    title: title,
                    description: desc,
                    content: contentHTML, // Lưu dưới dạng HTML thay vì Text thường
                    createdAt: serverTimestamp(),
                    authorEmail: auth.currentUser.email
                });

                document.getElementById('status-text').textContent = "Đã xuất bản thành công!";
                document.getElementById('status-text').style.color = "#16a34a";
                
                document.getElementById('post-title').value = ""; 
                document.getElementById('post-desc').value = ""; 
                quill.root.innerHTML = ""; // Xóa trắng editor

                setTimeout(() => {
                    document.getElementById('status-text').textContent = "Đang soạn thảo";
                    document.getElementById('status-text').style.color = "var(--text-main)";
                    publishBtn.disabled = false; publishBtn.textContent = "Xuất bản";
                }, 2000);

            } catch (error) {
                alert("Lỗi: " + error.message);
                publishBtn.disabled = false; publishBtn.textContent = "Xuất bản";
            }
        });
    </script>
</body>
</html>
