<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ATherapyHub - Trình Soạn Thảo</title>
    <link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        
        :root { --primary: #3B82F6; --bg-body: #F9FAFB; --bg-card: #FFFFFF; --text-main: #111827; --border-color: #E5E7EB; }
        body { font-family: 'Inter', sans-serif; margin: 0; background-color: var(--bg-body); color: var(--text-main); height: 100vh; display: flex; flex-direction: column; }
        
        #app-interface { display: flex; flex-direction: column; height: 100%; }
        header { background: var(--bg-card); padding: 12px 24px; border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; }
        .header-title { font-weight: 700; font-size: 18px; color: var(--text-main); letter-spacing: -0.3px; }
        .header-actions { display: flex; align-items: center; gap: 12px; }
        .btn-link { text-decoration: none; color: #4B5563; font-size: 14px; font-weight: 600; padding: 8px 16px; border-radius: 99px; background: #F3F4F6; transition: background 0.2s; }
        .btn-link:hover { background: #E5E7EB; }
        #btn-publish { background: var(--text-main); color: white; border: none; padding: 8px 24px; border-radius: 99px; font-weight: 600; cursor: pointer; transition: background 0.2s; font-size: 14px; }
        #btn-publish:hover { background: #374151; }
        
        .workspace { flex: 1; overflow-y: auto; background: var(--bg-body); display: flex; justify-content: center; padding: 40px 20px; }
        .page-container { background: var(--bg-card); width: 100%; max-width: 860px; padding: 60px; border-radius: 24px; box-shadow: 0 4px 20px rgba(0,0,0,0.03); border: 1px solid rgba(0,0,0,0.02); margin-bottom: 40px; }
        
        .title-input { width: 100%; border: none; font-size: 36px; font-weight: 700; outline: none; margin-bottom: 16px; color: var(--text-main); letter-spacing: -0.5px; }
        .title-input::placeholder { color: #D1D5DB; }
        .desc-input { width: 100%; border: none; font-size: 17px; outline: none; margin-bottom: 30px; color: #6B7280; resize: none; line-height: 1.6; }
        .desc-input::placeholder { color: #D1D5DB; }
        
        /* Tùy chỉnh công cụ soạn thảo Quill mượt mà hơn */
        .ql-toolbar { border: none !important; border-bottom: 1px solid var(--border-color) !important; padding: 12px 0 !important; margin-bottom: 20px; position: sticky; top: -60px; background: white; z-index: 10; }
        .ql-container { border: none !important; font-size: 17px !important; font-family: 'Inter', sans-serif !important; min-height: 400px; color: #374151; }
        .ql-editor { padding: 0 !important; line-height: 1.8; }
        .ql-editor.ql-blank::before { left: 0; color: #D1D5DB; font-style: normal; }
        .ql-editor img { max-width: 100%; border-radius: 12px; margin: 16px 0; }
        .ql-editor h2, .ql-editor h3 { color: var(--text-main); margin-top: 30px; margin-bottom: 12px; }

        .hidden { display: none !important; }

        #admin-login-overlay { position: fixed; inset: 0; background: var(--bg-body); display: flex; justify-content: center; align-items: center; z-index: 1000; padding: 20px; }
        .modal-box { background: var(--bg-card); padding: 32px; border-radius: 24px; width: 100%; max-width: 380px; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.1); border: 1px solid var(--border-color); box-sizing: border-box; }
        .modal-box h2 { text-align: center; color: var(--text-main); margin-top: 0; margin-bottom: 24px; }
        .modal-box input { width: 100%; padding: 12px 16px; border: 1px solid var(--border-color); border-radius: 12px; margin-bottom: 16px; box-sizing: border-box; font-size: 15px; background: #F9FAFB; }
        .modal-box input:focus { outline: none; border-color: var(--primary); background: white; }
        .btn-action { width: 100%; background: var(--primary); color: white; border: none; padding: 14px; border-radius: 12px; font-weight: 600; cursor: pointer; font-size: 15px; }

        @media (max-width: 768px) {
            header { padding: 12px 15px; }
            .workspace { padding: 0; }
            .page-container { padding: 24px; border-radius: 0; border: none; box-shadow: none; }
            .title-input { font-size: 28px; }
        }
    </style>
</head>
<body>

    <div id="admin-login-overlay">
        <div class="modal-box">
            <h2>Khu vực Quản trị</h2>
            <input type="email" id="admin-email" placeholder="Email" required>
            <input type="password" id="admin-password" placeholder="Mật khẩu" required>
            <button id="btn-admin-login" class="btn-action">Đăng nhập</button>
            <div id="login-error" style="color: #EF4444; margin-top: 15px; font-size: 14px; text-align: center;"></div>
        </div>
    </div>

    <div id="app-interface" class="hidden">
        <header>
            <div class="header-title" id="page-title">Tạo Tài Liệu Mới</div>
            <div class="header-actions">
                <a href="index.html" class="btn-link">← Hủy</a>
                <span id="status-text" style="font-size: 13px; color: #6B7280; margin-right: 8px;">Đang sẵn sàng</span>
                <button id="btn-publish">Xuất bản</button>
            </div>
        </header>

        <div class="workspace">
            <div class="page-container">
                <input type="text" id="post-title" class="title-input" placeholder="Tiêu đề...">
                <textarea id="post-desc" class="desc-input" placeholder="Viết mô tả ngắn gọn..." rows="2"></textarea>
                <div id="editor-container"></div>
            </div>
        </div>
    </div>

    <script src="https://cdn.quilljs.com/1.3.6/quill.js"></script>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, collection, addDoc, doc, getDoc, updateDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBcC-sXCRnZ1eg9gzGR25HvaNi-B1P3Xuo",
            authDomain: "datatherapy-52437.firebaseapp.com",
            projectId: "datatherapy-52437",
            storageBucket: "datatherapy-52437.firebasestorage.app",
            messagingSenderId: "206559916642",
            appId: "1:206559916642:web:d4e911752ef2bb3b58973b"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        const urlParams = new URLSearchParams(window.location.search);
        const editArticleId = urlParams.get('id');

        var quill = new Quill('#editor-container', {
            theme: 'snow',
            placeholder: 'Viết nội dung, hỗ trợ chèn ảnh và định dạng...',
            modules: { toolbar: [ [{ 'header': [2, 3, false] }], ['bold', 'italic', 'underline'], [{ 'list': 'ordered'}, { 'list': 'bullet' }], ['link', 'image'] ] }
        });

        async function loadArticleData(id) {
            document.getElementById('status-text').textContent = "Đang tải dữ liệu...";
            try {
                const docSnap = await getDoc(doc(db, "articles", id));
                if (docSnap.exists()) {
                    const data = docSnap.data();
                    document.getElementById('post-title').value = data.title;
                    document.getElementById('post-desc').value = data.description || '';
                    quill.root.innerHTML = data.content || '';
                    document.getElementById('status-text').textContent = "Đang chỉnh sửa";
                } else {
                    alert("Không tìm thấy bài viết này!");
                    window.location.href = "index.html";
                }
            } catch (error) {
                console.error("Lỗi:", error);
            }
        }

        onAuthStateChanged(auth, (user) => {
            if (user) {
                document.getElementById('admin-login-overlay').classList.add('hidden');
                document.getElementById('app-interface').classList.remove('hidden');
                
                if (editArticleId) {
                    document.getElementById('page-title').textContent = "Cập Nhật Tài Liệu";
                    document.getElementById('btn-publish').textContent = "Lưu thay đổi";
                    loadArticleData(editArticleId);
                }
            } else {
                document.getElementById('admin-login-overlay').classList.remove('hidden');
                document.getElementById('app-interface').classList.add('hidden');
            }
        });

        document.getElementById('btn-admin-login').addEventListener('click', () => {
            signInWithEmailAndPassword(auth, document.getElementById('admin-email').value, document.getElementById('admin-password').value)
                .catch(() => { document.getElementById('login-error').textContent = "Sai thông tin đăng nhập!"; });
        });

        const publishBtn = document.getElementById('btn-publish');
        
        publishBtn.addEventListener('click', async () => {
            const title = document.getElementById('post-title').value.trim();
            const desc = document.getElementById('post-desc').value.trim();
            const contentHTML = quill.root.innerHTML;

            if (!title) { alert("Phải nhập tiêu đề!"); return; }

            publishBtn.disabled = true; publishBtn.textContent = "Đang lưu...";

            try {
                if (editArticleId) {
                    await updateDoc(doc(db, "articles", editArticleId), {
                        title: title, description: desc, content: contentHTML
                    });
                    document.getElementById('status-text').textContent = "Đã lưu thành công!";
                } else {
                    await addDoc(collection(db, "articles"), {
                        title: title, description: desc, content: contentHTML,
                        createdAt: serverTimestamp(), authorEmail: auth.currentUser.email
                    });
                    document.getElementById('status-text').textContent = "Đã xuất bản thành công!";
                }

                document.getElementById('status-text').style.color = "#10B981";

                // Thay đổi: Cả Đăng mới và Cập nhật đều tự động về trang chủ sau 1 giây
                setTimeout(() => {
                    window.location.href = "index.html";
                }, 1000);

            } catch (error) {
                alert("Lỗi: " + error.message);
                publishBtn.disabled = false; publishBtn.textContent = editArticleId ? "Lưu thay đổi" : "Xuất bản";
            }
        });
    </script>
</body>
</html>
