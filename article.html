<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đọc bài viết - ATherapyHub</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        
        :root { --primary: #3B82F6; --bg-body: #F9FAFB; --bg-card: #FFFFFF; --text-main: #111827; --text-muted: #6B7280; --border-color: #E5E7EB; }
        
        body { font-family: 'Inter', sans-serif; background-color: var(--bg-body); color: var(--text-main); margin: 0; padding: 0; line-height: 1.8; }
        
        header { background-color: rgba(255, 255, 255, 0.9); backdrop-filter: blur(8px); padding: 16px 5%; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--border-color); position: sticky; top: 0; z-index: 100; }
        header h1 { margin: 0; font-size: 20px; color: var(--text-main); font-weight: 700; letter-spacing: -0.5px; }
        .btn-back { text-decoration: none; color: var(--text-main); background: #F3F4F6; padding: 8px 20px; border-radius: 99px; font-size: 14px; font-weight: 600; display: inline-flex; align-items: center; transition: background 0.2s; }
        .btn-back:hover { background: #E5E7EB; }

        #article-container { max-width: 760px; margin: 60px auto; padding: 0 20px; display: none; }
        .article-title { font-size: 36px; color: #111827; margin: 0 0 16px 0; line-height: 1.3; letter-spacing: -0.5px; font-weight: 700; }
        .article-meta { font-size: 14px; color: var(--text-muted); margin-bottom: 40px; padding-bottom: 20px; border-bottom: 1px solid var(--border-color); }

        .article-content { font-size: 17px; color: #374151; background: transparent; text-align: justify; }
        .article-content img { max-width: 100%; height: auto; border-radius: 12px; margin: 24px 0; display: block; box-shadow: 0 4px 6px rgba(0,0,0,0.02); }
        .article-content h2, .article-content h3 { color: #111827; margin-top: 40px; margin-bottom: 16px; text-align: left; letter-spacing: -0.3px; }
        .article-content ul, .article-content ol { padding-left: 24px; text-align: left; margin-bottom: 20px; }
        .article-content p { margin-bottom: 20px; }

        #status-msg { text-align: center; margin-top: 100px; font-size: 16px; color: var(--text-muted); }

        @media (max-width: 768px) {
            header { padding: 12px 15px; }
            #article-container { margin: 30px auto; }
            .article-title { font-size: 28px; }
            .article-content { font-size: 16px; }
        }
    </style>
</head>
<body>

    <header>
        <div style="display: flex; align-items: center; gap: 15px;">
            <a href="index.html" class="btn-back">← Quay lại</a>
            <h1>ATherapyHub</h1>
        </div>
    </header>

    <div id="status-msg">Đang tải tài liệu...</div>

    <div id="article-container">
        <h1 id="art-title" class="article-title"></h1>
        <div id="art-meta" class="article-meta"></div>
        <div id="art-content" class="article-content"></div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBcC-sXCRnZ1eg9gzGR25HvaNi-B1P3Xuo",
            authDomain: "datatherapy-52437.firebaseapp.com",
            projectId: "datatherapy-52437",
            storageBucket: "datatherapy-52437.firebasestorage.app",
            messagingSenderId: "206559916642",
            appId: "1:206559916642:web:d4e911752ef2bb3b58973b"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const urlParams = new URLSearchParams(window.location.search);
        const articleId = urlParams.get('id');

        async function fetchArticleDetails() {
            if (!articleId) { document.getElementById('status-msg').innerHTML = "Không tìm thấy bài viết."; return; }

            try {
                const docSnap = await getDoc(doc(db, "articles", articleId));
                if (docSnap.exists()) {
                    const data = docSnap.data();
                    document.getElementById('status-msg').style.display = 'none';
                    document.getElementById('article-container').style.display = 'block';

                    document.getElementById('art-title').textContent = data.title;
                    document.getElementById('art-content').innerHTML = data.content;

                    if (data.createdAt) {
                        document.getElementById('art-meta').textContent = "Cập nhật lần cuối: " + data.createdAt.toDate().toLocaleDateString('vi-VN');
                    }
                } else {
                    document.getElementById('status-msg').innerHTML = "Bài viết đã bị xóa hoặc không tồn tại.";
                }
            } catch (error) {
                document.getElementById('status-msg').innerHTML = "Lỗi: " + error.message;
            }
        }
        fetchArticleDetails();
    </script>
</body>
</html>
