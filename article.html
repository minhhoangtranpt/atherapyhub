<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đọc bài viết - QH Physio</title>
    <style>
        :root {
            --primary: #0284c7; --bg-body: #f8fafc;
            --bg-card: #ffffff; --text-main: #334155;
            --text-muted: #64748b; --border-color: #e2e8f0;
        }

        body { font-family: 'Inter', -apple-system, sans-serif; background-color: var(--bg-body); color: var(--text-main); margin: 0; padding: 0; line-height: 1.7; }

        header { background-color: var(--bg-card); padding: 16px 5%; display: flex; align-items: center; gap: 15px; border-bottom: 1px solid var(--border-color); position: sticky; top: 0; z-index: 100; }
        header h1 { margin: 0; font-size: 20px; color: var(--primary); font-weight: 700; }
        .btn-back { text-decoration: none; color: var(--text-main); background: #f1f5f9; padding: 8px 16px; border-radius: 8px; font-size: 14px; font-weight: 600; }

        #article-container { max-width: 800px; margin: 40px auto; padding: 0 20px; display: none; }
        .article-title { font-size: 32px; color: #0f172a; margin: 0 0 10px 0; line-height: 1.3; }
        .article-meta { font-size: 14px; color: var(--text-muted); margin-bottom: 30px; border-bottom: 1px solid var(--border-color); padding-bottom: 20px; }

        /* Định dạng hiển thị vùng nội dung */
        .article-content { 
            font-size: 17px; 
            color: #334155; 
            background: var(--bg-card); 
            padding: 40px; 
            border-radius: 12px; 
            border: 1px solid var(--border-color); 
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            text-align: justify; /* Thêm căn đều 2 bên tại đây */
        }
        
        .article-content img { max-width: 100%; height: auto; border-radius: 8px; margin: 15px 0; display: block; }
        .article-content h2, .article-content h3 { color: #0f172a; margin-top: 30px; text-align: left; /* Giữ tiêu đề căn trái để dễ nhìn */ }
        .article-content ul, .article-content ol { padding-left: 20px; text-align: left; /* Giữ danh sách căn trái để tránh lỗi khoảng trắng */ }

        #status-msg { text-align: center; margin-top: 100px; font-size: 16px; color: var(--text-muted); }
        .hidden { display: none !important; }

        /* TỐI ƯU GIAO DIỆN ĐIỆN THOẠI */
        @media (max-width: 768px) {
            header { padding: 12px 15px; }
            #article-container { margin: 20px auto; padding: 0 15px; }
            .article-title { font-size: 26px; }
            .article-content { padding: 20px; font-size: 16px; border-radius: 8px; }
        }
    </style>
</head>
<body>

    <header id="main-header" class="hidden">
        <a href="index.html" class="btn-back">← Quay lại</a>
        <h1>QH Physio</h1>
    </header>

    <div id="status-msg">Đang tải nội dung...</div>

    <div id="article-container">
        <h1 id="art-title" class="article-title"></h1>
        <div id="art-meta" class="article-meta"></div>
        
        <!-- Vùng chứa HTML đã được biên soạn bởi admin -->
        <div id="art-content" class="article-content"></div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyA9X9Ot7qA88POY2JmsRaQuagvRq2M83Aw",
            authDomain: "qhphysio.firebaseapp.com",
            projectId: "qhphysio",
            storageBucket: "qhphysio.firebasestorage.app",
            messagingSenderId: "1074697284977",
            appId: "1:1074697284977:web:8f4d73f7fca0a2ea09dad0"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        const urlParams = new URLSearchParams(window.location.search);
        const articleId = urlParams.get('id');

        async function fetchArticleDetails() {
            if (!articleId) { document.getElementById('status-msg').innerHTML = "Không tìm thấy bài viết. <a href='index.html'>Trang chủ</a>"; return; }

            try {
                const docSnap = await getDoc(doc(db, "articles", articleId));
                if (docSnap.exists()) {
                    const data = docSnap.data();
                    document.getElementById('status-msg').style.display = 'none';
                    document.getElementById('article-container').style.display = 'block';

                    document.getElementById('art-title').textContent = data.title;
                    document.getElementById('art-content').innerHTML = data.content;

                    if (data.createdAt) {
                        document.getElementById('art-meta').textContent = "Đăng ngày: " + data.createdAt.toDate().toLocaleDateString('vi-VN');
                    }
                } else {
                    document.getElementById('status-msg').innerHTML = "Bài viết đã bị xóa.";
                }
            } catch (error) {
                document.getElementById('status-msg').innerHTML = "Lỗi: " + error.message;
            }
        }

        onAuthStateChanged(auth, (user) => {
            if (user) {
                document.getElementById('main-header').classList.remove('hidden');
                fetchArticleDetails();
            } else {
                window.location.href = "index.html"; 
            }
        });
    </script>
</body>
</html>
